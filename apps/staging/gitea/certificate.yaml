apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-tessarack-dev
  namespace: gitea
spec:
  secretName: gitea-tessarack-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - git.tessarack.dev
  privateKey:
    algorithm: ECDSA
    size: 256
  duration: 2160h
  renewBefore: 720h
