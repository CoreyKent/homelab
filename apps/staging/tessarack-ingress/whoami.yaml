# Throwaway end-to-end proof for BOTH paths. Delete once the pattern is confirmed.
#
# pub.tessarack.dev   -> proxied CNAME -> tunnel -> Traefik :80 (web)      (public)
# priv.tessarack.dev  -> grey A record -> Traefik :443 (websecure) on tailnet (private)
#
# The public and private routes are NOT identical — they differ by how they're
# reached, and that difference is load-bearing (see each route's comment below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
        # Required for Homepage's status badge on the discovered tile. MEASURED
        # 26/07/2026 from the homepage pod's own log:
        #   "no pods found with namespace=tessarack-ingress and
        #    labelSelector=app.kubernetes.io/name=whoami-private"
        # Homepage derives the app name from the IngressRoute's metadata.name and
        # looks for pods labelled app.kubernetes.io/name=<that name>. These pods
        # carried only `app: whoami`, so discovery succeeded (the tile appeared)
        # but the status lookup found nothing and rendered NOT FOUND.
        # GENERAL RULE for migrating any app to annotation-based discovery: the
        # pod template must carry app.kubernetes.io/name equal to the
        # IngressRoute's name, or the tile shows NOT FOUND.
        # .spec.selector is deliberately left as `app: whoami` -- a Deployment's
        # selector is immutable, and adding a template label does not touch it.
        app.kubernetes.io/name: whoami-private
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.11.0
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
---
# PUBLIC route — reached only via cloudflared, which connects to Traefik on :80
# (the `web` entrypoint) as plain HTTP. TLS is terminated at the Cloudflare edge,
# so this router must NOT carry a `tls:` block: a tls block turns the router into
# a TLS router, and a plaintext request on :80 then matches nothing -> 404.
# (Verified 2026-07-21: web + no-tls serves; web + tls 404s.)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-public
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`pub.tessarack.dev`)
    kind: Rule
    services:
    - name: whoami
      port: 80
---
# PRIVATE route — reached directly by a tailnet client on :443 (the `websecure`
# entrypoint). No Cloudflare in this path, so Traefik terminates TLS itself with
# the wildcard cert. `.dev` is HSTS-preloaded, so a cert error here is
# NON-BYPASSABLE. This router DOES need the tls block, and only websecure.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-private
  # AUTO-DISCOVERY CANARY (2026-07-26). homepage's kubernetes.yaml already has
  # `ingress: true` + `traefik: true`, and its ClusterRole already grants
  # get/list on traefik.io/ingressroutes -- but no object had ever carried these
  # annotations, so discovery was unproven. This is the single-object test.
  # If a "Discovered" group appears on the dashboard with a Whoami tile, the
  # mechanism works and the hand-listed services.yaml entries can migrate to
  # per-app annotations (delete the manual entry in the SAME commit as adding
  # the annotation, or the tile will appear twice).
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Whoami"
    gethomepage.dev/description: "Auto-discovery canary"
    gethomepage.dev/group: "Discovered"
    gethomepage.dev/icon: "mdi-test-tube"
    # href pinned rather than inferred: Homepage parses Host() match rules
    # unreliably, and an unresolvable href is indistinguishable from discovery
    # having failed outright -- which would make this canary untrustworthy.
    gethomepage.dev/href: "https://priv.tessarack.dev"
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`priv.tessarack.dev`)
    kind: Rule
    services:
    - name: whoami
      port: 80
  tls:
    secretName: tessarack-dev-wildcard-tls
