# Throwaway end-to-end proof for BOTH paths. Delete once the pattern is confirmed.
#
# pub.tessarack.dev   -> proxied CNAME -> tunnel -> Traefik :80 (web)      (public)
# priv.tessarack.dev  -> grey A record -> Traefik :443 (websecure) on tailnet (private)
#
# The public and private routes are NOT identical — they differ by how they're
# reached, and that difference is load-bearing (see each route's comment below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
        # Retained after the canary was retired, though nothing reads it now.
        # It is the artifact of the lesson this canary actually taught, and the
        # rule it proved is documented on grafana-deployment.yaml where it is
        # load-bearing: Homepage derives an app's name from its IngressRoute's
        # metadata.name and queries pods with
        # labelSelector=app.kubernetes.io/name=<that name>. Discovery succeeds
        # without it (the tile appears) but the badge renders NOT FOUND.
        # Harmless to keep; delete with the rest if whoami itself ever goes.
        app.kubernetes.io/name: whoami-private
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.11.0
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
---
# PUBLIC route — reached only via cloudflared, which connects to Traefik on :80
# (the `web` entrypoint) as plain HTTP. TLS is terminated at the Cloudflare edge,
# so this router must NOT carry a `tls:` block: a tls block turns the router into
# a TLS router, and a plaintext request on :80 then matches nothing -> 404.
# (Verified 2026-07-21: web + no-tls serves; web + tls 404s.)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-public
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`pub.tessarack.dev`)
    kind: Rule
    services:
    - name: whoami
      port: 80
---
# PRIVATE route — reached directly by a tailnet client on :443 (the `websecure`
# entrypoint). No Cloudflare in this path, so Traefik terminates TLS itself with
# the wildcard cert. `.dev` is HSTS-preloaded, so a cert error here is
# NON-BYPASSABLE. This router DOES need the tls block, and only websecure.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-private
  # AUTO-DISCOVERY CANARY RETIRED 26/07/2026 — it did its job. The annotations
  # that lived here proved Homepage's IngressRoute discovery works end to end,
  # and Grafana now reaches the dashboard through that same mechanism
  # (apps/staging/health/grafana-ingressroute.yaml). Removing them also empties
  # and retires the "Discovered" layout group in the homepage configmap.
  #
  # The whoami DEPLOYMENT AND BOTH ROUTES ARE DELIBERATELY KEPT. Their job was
  # never the dashboard: pub.tessarack.dev and priv.tessarack.dev are the
  # standing proof that the two distinct ingress paths (cloudflared -> :80
  # plaintext, and direct tailnet -> :443 TLS) both still serve. That is worth
  # 10m of CPU. Say so if you want the whole app gone instead.
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`priv.tessarack.dev`)
    kind: Rule
    services:
    - name: whoami
      port: 80
  tls:
    secretName: tessarack-dev-wildcard-tls
