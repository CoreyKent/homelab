# MarginSignal — Kubernetes manifests
#
# Authored for Corey to review and push to github.com/CoreyKent/homelab himself.
# Nothing here is applied or committed on his behalf.
#
# Path in the GitOps repo: apps/base/marginsignal/
# Remember to add `marginsignal` to the parent kustomization resources list.
---
apiVersion: v1
kind: Namespace
metadata:
  name: marginsignal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marginsignal-data
  namespace: marginsignal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-iscsi-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marginsignal
  namespace: marginsignal
  labels:
    app.kubernetes.io/name: marginsignal
spec:
  replicas: 1
  strategy:
    # RWO volume — a rolling update would deadlock on Multi-Attach.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marginsignal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marginsignal
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: marginsignal
          image: 192.168.50.81:30500/marginsignal:0.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NTFY_SERVER
              value: "https://ntfy.sh"
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: marginsignal-ntfy
                  key: NTFY_TOPIC
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marginsignal-data
---
apiVersion: v1
kind: Service
metadata:
  name: marginsignal
  namespace: marginsignal
spec:
  selector:
    app.kubernetes.io/name: marginsignal
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: signal-tessarack-dev
  namespace: marginsignal
spec:
  secretName: signal-tessarack-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - signal.tessarack.dev
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: marginsignal-private
  namespace: marginsignal
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`signal.tessarack.dev`)
      services:
        - name: marginsignal
          port: 8000
  tls:
    secretName: signal-tessarack-dev-tls
