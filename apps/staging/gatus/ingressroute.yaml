# PRIVATE route, same posture as homepage: websecure + tls, reached only by
# tailnet clients via the tessarack-ingress node. Gatus's UI is unauthenticated
# by default and exposes the internal service topology, so it must not be public.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gatus
  namespace: gatus
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.tessarack.dev`)
      kind: Rule
      services:
        - name: gatus
          port: 8080
  tls:
    secretName: gatus-tessarack-dev-tls
