apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gatus-tessarack-dev
  namespace: gatus
spec:
  secretName: gatus-tessarack-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - status.tessarack.dev
  privateKey:
    algorithm: ECDSA
    size: 256
  duration: 2160h
  renewBefore: 720h
