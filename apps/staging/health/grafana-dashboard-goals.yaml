              "rawSql": "WITH w AS (SELECT generate_series(date_trunc('week', $__timeFrom()::timestamptz)::date, date_trunc('week', now())::date, interval '7 days')::date AS wk) SELECT w.wk::timestamp AS \"time\", coalesce(x.v, 0)::float8 AS \"classes\" FROM w LEFT JOIN (SELECT date_trunc('week', d)::date AS wk, count(*) AS v FROM (SELECT DISTINCT (raw->>'startTimeLocal')::date AS d FROM garmin.activity WHERE activity_type = 'mixed_martial_arts' AND coalesce(duration_s, 0) >= 1200 AND (raw->>'startTimeLocal')::date >= $__timeFrom()::date - 7) s GROUP BY 1) x ON x.wk = w.wk ORDER BY 1",
