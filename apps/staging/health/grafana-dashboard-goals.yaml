              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT m.local_date::timestamp AS \"time\", (m.value + g.calib_offset)::float8 AS \"reading\" FROM (SELECT DISTINCT ON (local_date) local_date, value FROM withings.measurement WHERE metric = 'muscle_mass' AND local_date >= $__timeFrom()::date - 7 ORDER BY local_date, ts) m CROSS JOIN ops.goal g WHERE g.goal_id = 'lean_mass' AND $__timeFilter(m.local_date) ORDER BY 1",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "postgres",
                "uid": "health-pg"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT \"time\", \"7-day mean\" FROM (SELECT m.local_date::timestamp AS \"time\", (avg(m.value) OVER (ORDER BY m.local_date RANGE BETWEEN INTERVAL '6 days' PRECEDING AND CURRENT ROW) + g.calib_offset)::float8 AS \"7-day mean\", m.local_date FROM (SELECT DISTINCT ON (local_date) local_date, value FROM withings.measurement WHERE metric = 'muscle_mass' AND local_date >= $__timeFrom()::date - 7 ORDER BY local_date, ts) m CROSS JOIN ops.goal g WHERE g.goal_id = 'lean_mass') s WHERE $__timeFilter(local_date) ORDER BY 1",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "postgres",
                "uid": "health-pg"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT day::timestamp AS \"time\", series AS metric, value::float8 AS value FROM ops.goal_trajectory_latest_v WHERE goal_id = 'lean_mass' ORDER BY 1",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "postgres",
                "uid": "health-pg"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT v.t AS \"time\", g.target::float8 AS \"target\" FROM ops.goal g CROSS JOIN (VALUES ($__timeFrom()::timestamptz), (now()), ($__timeTo()::timestamptz)) v(t) WHERE g.goal_id = 'lean_mass' AND g.target IS NOT NULL ORDER BY 1",
              "refId": "D"
            }
          ]
