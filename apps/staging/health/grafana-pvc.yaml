# Grafana's own database (users, annotations, starred dashboards, alert state).
#
# Was emptyDir until 2026-07-31, meaning every pod reschedule silently discarded
# it. That went unnoticed because the *dashboards* are provisioned from
# configMaps (grafana-dashboard-garmin / -withings / -overview) and regenerate —
# so the UI looked intact while annotations and users did not survive.
#
# 1Gi is the floor, not a guess: the Synology CSI driver rejects anything
# smaller ("Invalid input: required bytes is smaller than 1G"). Actual usage at
# migration time was ~20MB.
#
# -retain (not plain synology-iscsi) so deleting the PVC leaves the LUN intact.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: health
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-iscsi-retain
  resources:
    requests:
      storage: 1Gi
