# applied by Jobs pg-migrate-0001 (0001_init.sql) and pg-migrate-0002 (0002_nutrition.sql); idempotent wrapping so a Job re-run is safe; future migrations are new keys + new Jobs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-migrations
data:
  0001_init.sql: |
    CREATE SCHEMA IF NOT EXISTS garmin; CREATE SCHEMA IF NOT EXISTS withings; CREATE SCHEMA IF NOT EXISTS ops;

    -- local_date is a PLAIN column set by the collector at ingestion (Australia/Sydney),
    -- not a generated column: generated columns require IMMUTABLE functions and AT TIME ZONE
    -- is only STABLE — declaring it IMMUTABLE anyway is a correctness lie (audit finding, cut).

    CREATE TABLE IF NOT EXISTS garmin.daily_summary (
      calendar_date     date PRIMARY KEY,          -- Garmin device-local day
      steps             integer,
      resting_hr        smallint,                  -- bpm
      stress_avg        smallint,                  -- 0-100
      calories_active   integer,                   -- kcal
      calories_total    integer,                   -- kcal
      body_battery_high smallint, body_battery_low smallint,
      raw               jsonb,
      ingested_at       timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.sleep (
      calendar_date  date PRIMARY KEY,             -- wake-date key: midnight-safe
      sleep_start    timestamptz, sleep_end timestamptz,
      duration_s     integer, deep_s integer, light_s integer, rem_s integer, awake_s integer,
      score          smallint, avg_spo2 real, avg_respiration real,
      raw            jsonb, ingested_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.sleep_stage (
      calendar_date  date NOT NULL REFERENCES garmin.sleep(calendar_date) ON DELETE CASCADE,
      start_ts       timestamptz NOT NULL, end_ts timestamptz NOT NULL,
      stage          text NOT NULL CHECK (stage IN ('deep','light','rem','awake')),
      PRIMARY KEY (calendar_date, start_ts)
    );

    CREATE TABLE IF NOT EXISTS garmin.hrv (
      calendar_date date PRIMARY KEY,
      last_night_avg_ms smallint, weekly_avg_ms smallint,
      status text, baseline_low_ms smallint, baseline_high_ms smallint,
      ingested_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.training_status (
      calendar_date date PRIMARY KEY,
      status text, vo2max real, load_7d real, raw jsonb,
      ingested_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.activity (
      activity_id      bigint PRIMARY KEY,          -- vendor-native natural key
      start_ts         timestamptz NOT NULL,
      local_date       date NOT NULL,               -- collector-computed (Australia/Sydney)
      activity_type    text NOT NULL, name text,
      duration_s       integer, distance_m real, calories integer,
      avg_hr smallint, max_hr smallint, elevation_gain_m real,
      avg_pace_s_km    real, hr_zones jsonb, raw jsonb,
      ingested_at      timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS activity_type_ts ON garmin.activity (activity_type, start_ts DESC);
    CREATE INDEX IF NOT EXISTS activity_local_date ON garmin.activity (local_date);

    CREATE TABLE IF NOT EXISTS garmin.intraday (                  -- generic scalar series
      metric  text NOT NULL CHECK (metric IN
              ('heart_rate','stress','body_battery','spo2','respiration')),
      ts      timestamptz NOT NULL,
      value   real NOT NULL,
      PRIMARY KEY (metric, ts)
    );
    -- (no separate ts index: the composite PK serves every dashboard query pattern; a BRIN on ts
    --  was cut — heap order follows (metric, ts) batches, killing BRIN's block-range correlation)

    CREATE TABLE IF NOT EXISTS garmin.steps_epoch (
      start_ts timestamptz PRIMARY KEY,
      duration_s smallint NOT NULL, steps integer NOT NULL, activity_level text
    );

    CREATE TABLE IF NOT EXISTS withings.measurement (
      group_id     bigint NOT NULL,                 -- Withings grpid
      measure_type integer NOT NULL,                -- 1 weight, 5 FFM, 6 fat%, 8 fat kg, 76 muscle, 77 hydration, 88 bone…
      metric       text NOT NULL,
      ts           timestamptz NOT NULL,
      local_date   date NOT NULL,                   -- collector-computed (Australia/Sydney)
      value        numeric(8,3) NOT NULL,           -- normalized: value * 10^unit at ingestion
      ingested_at  timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (group_id, measure_type)
    );
    CREATE INDEX IF NOT EXISTS measurement_metric_ts ON withings.measurement (metric, ts DESC);
    CREATE INDEX IF NOT EXISTS measurement_metric_localdate ON withings.measurement (metric, local_date);

    CREATE OR REPLACE VIEW withings.daily_weight AS            -- canonical: FIRST weigh-in of local day
    SELECT DISTINCT ON (local_date) local_date, ts, value AS weight_kg
    FROM withings.measurement WHERE metric = 'weight'
    ORDER BY local_date, ts ASC, group_id ASC;      -- group_id = deterministic tie-break on equal ts

    CREATE TABLE IF NOT EXISTS ops.sync_state (
      source text NOT NULL, stream text NOT NULL,
      watermark timestamptz NOT NULL,               -- re-fetch watermark - 72h (late arrivals)
      blocked_until timestamptz,                    -- 429 state machine: runs no-op until passed.
                                                    -- Garmin 429s are ACCOUNT-level: written to the
                                                    -- ('garmin','_account') sentinel row, checked by
                                                    -- ALL garmin streams before any call (audit fix)
      extra jsonb, updated_at timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (source, stream)
    );

    CREATE TABLE IF NOT EXISTS ops.run_log (
      run_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      source text NOT NULL, stream text NOT NULL,
      kind text NOT NULL CHECK (kind IN ('cron','backfill')),
      started_at timestamptz NOT NULL DEFAULT now(), finished_at timestamptz,
      status text CHECK (status IN ('ok','partial','failed')),
      days_attempted integer, days_failed integer, rows_upserted integer,
      first_error text, details jsonb
    );
    CREATE INDEX IF NOT EXISTS run_log_source_started ON ops.run_log (source, started_at DESC);

    -- Withings chain: refresh under advisory lock; COMMIT new pair BEFORE first use
    -- (old refresh token stays valid until the new access token is first used — crash-safe).
    CREATE TABLE IF NOT EXISTS ops.withings_oauth_token (
      singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),
      access_token text NOT NULL, refresh_token text NOT NULL,
      access_expires_at timestamptz NOT NULL,
      refreshed_at timestamptz NOT NULL DEFAULT now(),
      refresh_count integer NOT NULL DEFAULT 0
    );

    CREATE TABLE IF NOT EXISTS ops.garmin_session (
      singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),
      token_blob jsonb NOT NULL, refreshed_at timestamptz NOT NULL DEFAULT now()
    );

    -- Goal values: seeded BY HAND via psql (never via Git-tracked migrations — public repo).
    CREATE TABLE IF NOT EXISTS ops.goal (
      metric      text PRIMARY KEY,                -- 'weight_kg'
      target      numeric(8,3) NOT NULL,
      target_date date,
      note        text,
      updated_at  timestamptz NOT NULL DEFAULT now()
    );

    -- Roles are created WITHOUT passwords here on purpose: this DDL lives in the PUBLIC repo, and
    -- passwords belong in SOPS-encrypted Secrets. CNPG's declarative `managed.roles` (passwordSecret)
    -- owns role creation + credentials; this migration only shapes GRANTs (audit fix).
    GRANT USAGE ON SCHEMA garmin, withings TO qs_writer;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA garmin, withings TO qs_writer;
    ALTER DEFAULT PRIVILEGES IN SCHEMA garmin, withings
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO qs_writer;
    -- ops: per-table for the writer — it must NOT touch ops.goal (hand-seeded, least-privilege):
    GRANT USAGE ON SCHEMA ops TO qs_writer;
    GRANT SELECT, INSERT, UPDATE, DELETE
      ON ops.sync_state, ops.run_log, ops.withings_oauth_token, ops.garmin_session TO qs_writer;
    GRANT SELECT ON ops.goal TO qs_writer;          -- read-only: goal is Corey's, not the collector's
    -- reader: metric schemas broadly (future metric tables SHOULD be visible — deliberate),
    -- ops strictly per-table; token tables have no reader path at all:
    GRANT USAGE ON SCHEMA garmin, withings TO qs_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA garmin, withings TO qs_reader;
    ALTER DEFAULT PRIVILEGES IN SCHEMA garmin, withings GRANT SELECT ON TABLES TO qs_reader;
    GRANT USAGE ON SCHEMA ops TO qs_reader;
    GRANT SELECT ON ops.run_log, ops.sync_state, ops.goal TO qs_reader;
    -- no reader grant on token tables, and no ops-wide default privileges for either role:
    -- a future ops table starts reachable by nobody until explicitly granted
  0002_nutrition.sql: |
    -- Nutrition in PostgreSQL keeps the same split as the local intake layer:
    -- daily macros stay wide for the constant reads, while micronutrients stay
    -- long-form because the metric set is sparse and changes over time.
    -- The upstream intake source is a manual export, not a live API feed, so data
    -- freshness cannot safely live in session context or operator memory.
    -- nutrition_v therefore carries the freshness verdict on every row, adjacent to
    -- the intake values being read, so every consumer sees age with the numbers.
    -- Supplements can be logged as foods and otherwise disappear into daily totals,
    -- so detection is modeled explicitly instead of inferred ad hoc.
    -- Detection is signature-based: two per-unit metrics imply integer units,
    -- capped by config, and days before first detection remain pre_tracking rather
    -- than not_taken because earlier history is unknown.
    -- SQLite CAST(... AS INTEGER) truncates toward zero; this port preserves that
    -- with trunc(... )::int anywhere age or unit counts depend on the cast result.
    -- The supplement config tables are created empty on purpose. This repository is
    -- public, so private config values are not embedded in the migration; the
    -- importer seeds them from code after install.
    -- Re-runs must not destroy already-seeded config, so the migration is written
    -- to be idempotent and safe to apply again.
    -- Role creation and any credentials are owned elsewhere; this file only grants
    -- access to existing roles, which are created separately without passwords.

    BEGIN;

    CREATE SCHEMA IF NOT EXISTS nutrition;

    -- Manual exports do not stay fresh on their own, so the canonical read view
    -- carries a freshness verdict on every row instead of relying on session
    -- context.
    CREATE TABLE IF NOT EXISTS nutrition.daily (
        id bigint GENERATED BY DEFAULT AS IDENTITY UNIQUE,
        date date NOT NULL,
        source text NOT NULL,
        calories_kcal double precision,
        protein_g double precision,
        carbs_g double precision,
        fat_g double precision,
        fetched_at text NOT NULL,
        PRIMARY KEY (date, source)
    );

    CREATE INDEX IF NOT EXISTS idx_nutrition_date
        ON nutrition.daily (date);

    CREATE TABLE IF NOT EXISTS nutrition.micros (
        id bigint GENERATED BY DEFAULT AS IDENTITY UNIQUE,
        date date NOT NULL,
        source text NOT NULL,
        metric text NOT NULL,
        value double precision,
        fetched_at text NOT NULL,
        PRIMARY KEY (date, source, metric)
    );

    CREATE INDEX IF NOT EXISTS idx_nutrition_micros_date
        ON nutrition.micros (date);

    CREATE INDEX IF NOT EXISTS idx_nutrition_micros_metric
        ON nutrition.micros (metric);

    -- A supplement logged as a food is otherwise mixed into the daily micro totals.
    -- Detection is signature-based, and the config is seeded later by the importer,
    -- never by this public migration, so re-runs must not delete existing rows.
    CREATE TABLE IF NOT EXISTS nutrition.supplement_products (
        product text PRIMARY KEY,
        display_name text NOT NULL,
        macrofactor_entry text NOT NULL,
        unit_name text NOT NULL,
        max_units integer NOT NULL CHECK (max_units >= 1),
        sig_metric_1 text NOT NULL,
        sig_per_unit_1 double precision NOT NULL CHECK (sig_per_unit_1 > 0),
        sig_metric_2 text NOT NULL,
        sig_per_unit_2 double precision NOT NULL CHECK (sig_per_unit_2 > 0),
        sig_frac double precision NOT NULL,
        track_from date NOT NULL,
        notes text
    );

    CREATE TABLE IF NOT EXISTS nutrition.supplement_contents (
        product text NOT NULL,
        metric text NOT NULL,
        value_per_unit double precision NOT NULL,
        PRIMARY KEY (product, metric)
    );

    CREATE OR REPLACE VIEW nutrition.nutrition_v AS
    SELECT
        n.*,
        MAX(n.date) OVER () AS data_last_entry,
        trunc(
            EXTRACT(
                EPOCH FROM (
                    (now() AT TIME ZONE 'UTC') - (MAX(n.date) OVER ())::timestamp
                )
            ) / 86400.0
        )::int AS data_age_days,
        CASE
            WHEN EXTRACT(
                EPOCH FROM (
                    (now() AT TIME ZONE 'UTC') - (MAX(n.date) OVER ())::timestamp
                )
            ) / 86400.0 > 14
                THEN 'STALE — last entry ' || to_char(MAX(n.date) OVER (), 'YYYY-MM-DD')
                     || ' — ASK COREY TO RE-EXPORT MacroFactor'
            WHEN EXTRACT(
                EPOCH FROM (
                    (now() AT TIME ZONE 'UTC') - (MAX(n.date) OVER ())::timestamp
                )
            ) / 86400.0 > 3
                THEN 'AGING — last entry ' || to_char(MAX(n.date) OVER (), 'YYYY-MM-DD')
                     || ' — state the age before quoting current intake'
            ELSE 'fresh — last entry ' || to_char(MAX(n.date) OVER (), 'YYYY-MM-DD')
        END AS freshness
    FROM nutrition.daily AS n;

    CREATE OR REPLACE VIEW nutrition.supplement_days_v AS
    WITH det AS (
        SELECT
            n.date,
            p.product,
            p.display_name,
            p.max_units,
            p.track_from,
            CASE
                WHEN n.date < p.track_from THEN 0
                -- LEAST() is safe here: every argument is non-NULL via NOT NULL
                -- config, COALESCE() on the observed totals, and write-time checks
                -- that forbid zero divisors.
                ELSE LEAST(
                    p.max_units,
                    trunc(COALESCE(m1.value, 0) / p.sig_per_unit_1 + 1 - p.sig_frac)::int,
                    trunc(COALESCE(m2.value, 0) / p.sig_per_unit_2 + 1 - p.sig_frac)::int
                )
            END AS units
        FROM nutrition.daily AS n
        CROSS JOIN nutrition.supplement_products AS p
        LEFT JOIN nutrition.micros AS m1
            ON m1.date = n.date
           AND m1.source = n.source
           AND m1.metric = p.sig_metric_1
        LEFT JOIN nutrition.micros AS m2
            ON m2.date = n.date
           AND m2.source = n.source
           AND m2.metric = p.sig_metric_2
    ),
    first_hit AS (
        SELECT
            det.product,
            MIN(det.date) AS first_detected
        FROM det
        WHERE det.units >= 1
        GROUP BY det.product
    )
    SELECT
        det.date,
        det.product,
        det.display_name,
        det.units,
        det.max_units,
        CASE WHEN det.units = det.max_units THEN 1 ELSE 0 END AS full_dose,
        first_hit.first_detected,
        CASE
            WHEN det.units >= 1 THEN 'taken'
            WHEN first_hit.first_detected IS NULL
                 OR det.date < first_hit.first_detected THEN 'pre_tracking'
            ELSE 'not_taken'
        END AS status
    FROM det
    LEFT JOIN first_hit
        ON first_hit.product = det.product;

    CREATE OR REPLACE VIEW nutrition.nutrition_food_v AS
    WITH supp AS (
        SELECT
            s.date,
            c.metric,
            SUM(c.value_per_unit * s.units) AS amount
        FROM nutrition.supplement_days_v AS s
        JOIN nutrition.supplement_contents AS c
            ON c.product = s.product
        WHERE s.units >= 1
        GROUP BY s.date, c.metric
    )
    SELECT
        m.date,
        m.metric,
        m.value AS total_logged,
        COALESCE(supp.amount, 0) AS from_supplements,
        CASE
            WHEN m.value IS NULL THEN NULL
            ELSE GREATEST(m.value - COALESCE(supp.amount, 0), 0)
        END AS food_only,
        (
            SELECT string_agg(s.product, ',')
            FROM nutrition.supplement_days_v AS s
            WHERE s.date = m.date
              AND s.status = 'pre_tracking'
        ) AS untracked_products
    FROM nutrition.micros AS m
    LEFT JOIN supp
        ON supp.date = m.date
       AND supp.metric = m.metric;

    -- Role creation and credentials live elsewhere; this migration only shapes
    -- grants for the schema objects created here.
    GRANT USAGE ON SCHEMA nutrition TO qs_writer, qs_reader;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA nutrition TO qs_writer;
    GRANT SELECT ON ALL TABLES IN SCHEMA nutrition TO qs_reader;

    ALTER DEFAULT PRIVILEGES IN SCHEMA nutrition
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO qs_writer;

    ALTER DEFAULT PRIVILEGES IN SCHEMA nutrition
        GRANT SELECT ON TABLES TO qs_reader;

    COMMIT;
  0003_activity_local_date.sql: |
    -- Migration 0003: date Garmin activities where they happened.
    -- Until collector 0.1.2 the collector set garmin.activity.local_date by converting
    -- startTimeGMT to Australia/Sydney, which put every activity recorded abroad a day
    -- late (55 of 372 rows on 03/11/2026, all on US trips). Garmin's startTimeLocal is
    -- already in the activity's own timezone; collector 0.1.2 uses it for new rows, and
    -- this repairs the existing ones from the raw payload each row already stores.
    -- Idempotent: touches only rows whose local_date differs; a rerun changes 0 rows.
    -- A malformed startTimeLocal (not YYYY-MM-DD...) is skipped, not guessed.
    BEGIN;
    DO $$
    DECLARE
      n integer;
    BEGIN
      UPDATE garmin.activity
         SET local_date = substring(raw->>'startTimeLocal' FROM 1 FOR 10)::date
       WHERE raw->>'startTimeLocal' ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
         AND local_date IS DISTINCT FROM substring(raw->>'startTimeLocal' FROM 1 FOR 10)::date;
      GET DIAGNOSTICS n = ROW_COUNT;
      RAISE NOTICE 'garmin.activity local_date repaired: % rows', n;
    END
    $$;
    COMMIT;
  0004_reader_sequences.sql: |
    -- Migration 0004 (04/11/2026): let qs_reader (and so carter, by membership) read SEQUENCES.
    -- pg_dump as a read-only role needs SELECT on every sequence it dumps; without it the off-NAS
    -- dump (claude-pai BackupPgDump.ts) failed on nutrition.daily_id_seq. Reading a sequence only
    -- exposes its counter. The token tables stay unreadable (no grant here touches them).
    BEGIN;
    GRANT SELECT ON ALL SEQUENCES IN SCHEMA garmin, withings, nutrition TO qs_reader;
    GRANT SELECT ON SEQUENCE ops.run_log_run_id_seq TO qs_reader;
    ALTER DEFAULT PRIVILEGES IN SCHEMA garmin, withings, nutrition GRANT SELECT ON SEQUENCES TO qs_reader;
    COMMIT;
  0005_supplement_schedule.sql: |
    -- 0005: declared sleep-powder schedule (19/11/2026).
    --
    -- Switch Sleep+ and Wulf Sleep share magnesium as their only usable signature,
    -- and Switch's folate signature is reachable by food plus Thorne alone, so the
    -- export cannot say WHICH powder was taken. supplement_schedule records it, as
    -- declared by Corey, and supplement_days_v counts a scheduled product only on
    -- its scheduled dates. Products with no schedule rows are unaffected.
    --
    -- Like 0002, the config rows are seeded by the importer from db_utils.py, never
    -- by this public migration. Idempotent: CREATE IF NOT EXISTS / CREATE OR REPLACE
    -- (the view's output columns are unchanged, so OR REPLACE is legal).

    BEGIN;

    CREATE TABLE IF NOT EXISTS nutrition.supplement_schedule (
        product text NOT NULL,
        from_date date NOT NULL,
        to_date date,
        note text,
        PRIMARY KEY (product, from_date),
        CHECK (to_date IS NULL OR to_date >= from_date)
    );

    CREATE OR REPLACE VIEW nutrition.supplement_days_v AS
    WITH det AS (
        SELECT
            n.date,
            p.product,
            p.display_name,
            p.max_units,
            p.track_from,
            CASE
                WHEN n.date < p.track_from THEN 0
                -- 0005: a product with schedule rows counts only on its scheduled
                -- dates (to_date NULL = open-ended). See supplement_schedule.
                WHEN EXISTS (
                         SELECT 1 FROM nutrition.supplement_schedule AS s
                         WHERE s.product = p.product)
                 AND NOT EXISTS (
                         SELECT 1 FROM nutrition.supplement_schedule AS s
                         WHERE s.product = p.product
                           AND n.date >= s.from_date
                           AND (s.to_date IS NULL OR n.date <= s.to_date)) THEN 0
                -- LEAST() is safe here: every argument is non-NULL via NOT NULL
                -- config, COALESCE() on the observed totals, and write-time checks
                -- that forbid zero divisors.
                ELSE LEAST(
                    p.max_units,
                    trunc(COALESCE(m1.value, 0) / p.sig_per_unit_1 + 1 - p.sig_frac)::int,
                    trunc(COALESCE(m2.value, 0) / p.sig_per_unit_2 + 1 - p.sig_frac)::int
                )
            END AS units
        FROM nutrition.daily AS n
        CROSS JOIN nutrition.supplement_products AS p
        LEFT JOIN nutrition.micros AS m1
            ON m1.date = n.date
           AND m1.source = n.source
           AND m1.metric = p.sig_metric_1
        LEFT JOIN nutrition.micros AS m2
            ON m2.date = n.date
           AND m2.source = n.source
           AND m2.metric = p.sig_metric_2
    ),
    first_hit AS (
        SELECT
            det.product,
            MIN(det.date) AS first_detected
        FROM det
        WHERE det.units >= 1
        GROUP BY det.product
    )
    SELECT
        det.date,
        det.product,
        det.display_name,
        det.units,
        det.max_units,
        CASE WHEN det.units = det.max_units THEN 1 ELSE 0 END AS full_dose,
        first_hit.first_detected,
        CASE
            WHEN det.units >= 1 THEN 'taken'
            WHEN first_hit.first_detected IS NULL
                 OR det.date < first_hit.first_detected THEN 'pre_tracking'
            ELSE 'not_taken'
        END AS status
    FROM det
    LEFT JOIN first_hit
        ON first_hit.product = det.product;

    GRANT SELECT, INSERT, UPDATE, DELETE ON nutrition.supplement_schedule TO qs_writer;
    GRANT SELECT ON nutrition.supplement_schedule TO qs_reader;

    COMMIT;
  0006_goals.sql: |
    -- 0006: goals & trajectory (22/11/2026). EXPAND ONLY — nothing existing is dropped or renamed.
    --
    -- ops.goal gains a goal_id identity and per-kind columns so several goals can share one source series
    -- (the two body-fat goals read the same Withings series). Legacy rows (metric='weight_kg', 'height_m')
    -- keep goal_id NULL and stay exactly as they are until the overview/withings/BMI panels are proven on the
    -- new shape; a later migration removes them. Goal VALUES are never written here — this repo is public;
    -- they are seeded by hand from a private file. The only data statement copies an existing row (height)
    -- into ops.setting without naming its value.
    --
    -- Results: the goals job (claude-pai) READS with qs_reader and WRITES with qs_goals, which may only
    -- INSERT into the three result tables. A run is committed in one transaction with its goal_run row
    -- (status 'ok', written_count = expected_count); readers select the latest such run by run_id.
    -- Failed runs get a separate 'failed' row. Nothing is ever updated or deleted by the job.

    BEGIN;

    -- ── ops.goal: expand ────────────────────────────────────────────────────────────────────────────
    ALTER TABLE ops.goal ALTER COLUMN target DROP NOT NULL;   -- band goals have no single target
    ALTER TABLE ops.goal
      ADD COLUMN IF NOT EXISTS goal_id         text,
      ADD COLUMN IF NOT EXISTS kind            text,
      ADD COLUMN IF NOT EXISTS source_key      text,
      ADD COLUMN IF NOT EXISTS direction       text,
      ADD COLUMN IF NOT EXISTS start_date      date,
      ADD COLUMN IF NOT EXISTS start_value     numeric(8,3),
      ADD COLUMN IF NOT EXISTS band_lo         numeric(8,3),
      ADD COLUMN IF NOT EXISTS band_hi         numeric(8,3),
      ADD COLUMN IF NOT EXISTS calib_offset    numeric(6,3) NOT NULL DEFAULT 0,
      ADD COLUMN IF NOT EXISTS calib_offset_sd numeric(6,3) NOT NULL DEFAULT 0,
      ADD COLUMN IF NOT EXISTS unit            text,
      ADD COLUMN IF NOT EXISTS label           text,
      ADD COLUMN IF NOT EXISTS active          boolean NOT NULL DEFAULT true,
      ADD COLUMN IF NOT EXISTS sort            integer NOT NULL DEFAULT 100,
      ADD COLUMN IF NOT EXISTS closed_at       date,
      ADD COLUMN IF NOT EXISTS closed_value    numeric(8,3);

    CREATE UNIQUE INDEX IF NOT EXISTS goal_goal_id_uq ON ops.goal (goal_id);

    -- Per-kind shape. Legacy rows (goal_id NULL) are exempt. Drop-then-add keeps a Job re-run idempotent.
    ALTER TABLE ops.goal DROP CONSTRAINT IF EXISTS goal_kind_shape_ck;
    ALTER TABLE ops.goal ADD CONSTRAINT goal_kind_shape_ck CHECK (
      goal_id IS NULL OR (
        goal_id ~ '^[a-z][a-z0-9_]{1,40}$'
        AND label IS NOT NULL AND unit IS NOT NULL AND start_date IS NOT NULL
        AND calib_offset_sd >= 0
        AND source_key IN ('withings.fat_ratio', 'withings.muscle_mass', 'withings.weight',
                           'nutrition.protein_g', 'garmin.strength_training', 'garmin.mixed_martial_arts',
                           'garmin.sleep_hours')
        AND CASE kind
          WHEN 'dated'   THEN target IS NOT NULL AND target_date IS NOT NULL AND direction IN ('up','down')
          WHEN 'undated' THEN target IS NOT NULL AND target_date IS NULL     AND direction IN ('up','down')
          WHEN 'band'    THEN band_lo IS NOT NULL AND band_hi IS NOT NULL AND band_lo < band_hi
                              AND target IS NULL AND direction IS NULL
          WHEN 'count'   THEN target IS NOT NULL AND direction IN ('up','down')
          WHEN 'mean'    THEN target IS NOT NULL AND direction IN ('up','down')
          WHEN 'intake'  THEN target IS NOT NULL AND direction IN ('up','down')
          ELSE false
        END
      )
    );

    -- ── ops.setting: constants are not goals ────────────────────────────────────────────────────────
    CREATE TABLE IF NOT EXISTS ops.setting (
      key        text PRIMARY KEY,
      value      numeric(10,4) NOT NULL,
      unit       text,
      note       text,
      updated_at timestamptz NOT NULL DEFAULT now()
    );
    INSERT INTO ops.setting (key, value, unit, note)
      SELECT 'height_m', target, 'm', 'copied from ops.goal by 0006'
      FROM ops.goal WHERE metric = 'height_m' AND target IS NOT NULL
      ON CONFLICT (key) DO NOTHING;

    -- ── results ─────────────────────────────────────────────────────────────────────────────────────
    CREATE TABLE IF NOT EXISTS ops.goal_run (
      run_id          uuid PRIMARY KEY,
      job             text NOT NULL DEFAULT 'goals' CHECK (job = 'goals'),
      started_at      timestamptz NOT NULL,
      finished_at     timestamptz NOT NULL DEFAULT now(),
      status          text NOT NULL CHECK (status IN ('ok','failed')),
      expected_count  integer NOT NULL CHECK (expected_count >= 0),
      written_count   integer NOT NULL CHECK (written_count >= 0),
      engine_version  text NOT NULL,
      error           text
    );
    CREATE INDEX IF NOT EXISTS goal_run_ok_idx ON ops.goal_run (finished_at DESC) WHERE status = 'ok';

    CREATE TABLE IF NOT EXISTS ops.goal_progress (
      run_id             uuid NOT NULL REFERENCES ops.goal_run (run_id),
      goal_id            text NOT NULL,
      as_of              date NOT NULL,
      state              text NOT NULL,
      window_from        date,
      n                  integer NOT NULL,
      span_days          integer NOT NULL,
      fitted             numeric(10,4),
      slope_wk           numeric(10,4),
      hw95_wk            numeric(10,4),
      target_used        numeric(10,4),
      offset_used        numeric(6,3) NOT NULL,
      required_wk        numeric(10,4),
      projected          numeric(10,4),
      projected_lo       numeric(10,4),
      projected_hi       numeric(10,4),
      eta_weeks          numeric(8,2),
      current_value      numeric(10,4),
      weeks_met          integer,
      source_age_days    numeric(8,2),
      last_evidence_date date,
      detail             text NOT NULL,
      PRIMARY KEY (run_id, goal_id)
    );

    CREATE TABLE IF NOT EXISTS ops.goal_trajectory (
      run_id  uuid NOT NULL REFERENCES ops.goal_run (run_id),
      goal_id text NOT NULL,
      series  text NOT NULL CHECK (series IN ('central','lo','hi','required','plan')),
      day     date NOT NULL,
      value   numeric(10,4) NOT NULL,
      PRIMARY KEY (run_id, goal_id, series, day)
    );

    -- Latest COMPLETE successful run. Every panel and the dead-man read through these, never max(as_of).
    CREATE OR REPLACE VIEW ops.goal_latest_run_v AS
      SELECT r.* FROM ops.goal_run r
      WHERE r.status = 'ok' AND r.written_count = r.expected_count
      ORDER BY r.finished_at DESC
      LIMIT 1;

    CREATE OR REPLACE VIEW ops.goal_progress_latest_v AS
      SELECT p.*, g.label, g.unit, g.kind, g.direction, g.target, g.target_date, g.band_lo, g.band_hi,
             g.sort, r.finished_at AS run_finished_at
      FROM ops.goal_latest_run_v r
      JOIN ops.goal_progress p ON p.run_id = r.run_id
      JOIN ops.goal g ON g.goal_id = p.goal_id;

    CREATE OR REPLACE VIEW ops.goal_trajectory_latest_v AS
      SELECT t.* FROM ops.goal_latest_run_v r JOIN ops.goal_trajectory t ON t.run_id = r.run_id;

    -- One row the dead-man checks. ok = nothing to watch (no active goals yet), OR a complete run in the last
    -- 26 h that covered every active goal and left none stale. Fails closed: a missing run means ok = false.
    CREATE OR REPLACE VIEW ops.goal_health_v AS
      WITH active AS (SELECT goal_id FROM ops.goal WHERE goal_id IS NOT NULL AND active),
           r AS (SELECT * FROM ops.goal_latest_run_v),
           covered AS (SELECT count(*) AS n FROM active a JOIN ops.goal_progress p
                         ON p.goal_id = a.goal_id AND p.run_id = (SELECT run_id FROM r)),
           stale AS (SELECT count(*) AS n FROM ops.goal_progress p
                       WHERE p.run_id = (SELECT run_id FROM r) AND p.state = 'stale-data')
      SELECT (SELECT count(*) FROM active)                                       AS active_goals,
             (SELECT n FROM covered)                                             AS goals_in_latest_run,
             (SELECT n FROM stale)                                               AS stale_goals,
             (SELECT extract(epoch FROM now() - finished_at) / 3600 FROM r)      AS latest_ok_age_hours,
             (SELECT count(*) FROM active) = 0
               OR (    coalesce((SELECT finished_at FROM r) > now() - interval '26 hours', false)
                   AND (SELECT n FROM covered) = (SELECT count(*) FROM active)
                   AND (SELECT n FROM stale) = 0)                                AS ok;

    -- ── grants ──────────────────────────────────────────────────────────────────────────────────────
    -- qs_goals: INSERT only, on the three result tables. No SELECT anywhere, nothing on ops.goal.
    GRANT USAGE ON SCHEMA ops TO qs_goals;
    GRANT INSERT ON ops.goal_run, ops.goal_progress, ops.goal_trajectory TO qs_goals;
    -- qs_reader (Grafana, the job's read side, carter by membership): read the new objects.
    GRANT SELECT ON ops.setting, ops.goal_run, ops.goal_progress, ops.goal_trajectory,
                    ops.goal_latest_run_v, ops.goal_progress_latest_v, ops.goal_trajectory_latest_v,
                    ops.goal_health_v TO qs_reader;

    -- ── assertions (synthetic, rolled back inside sub-transactions) ─────────────────────────────────
    DO $$
    BEGIN
      -- a dated goal without a date must be rejected
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('__assert_1', 'zz_assert_dated', 'dated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION 'assertion: dated goal without target_date was accepted';
      EXCEPTION WHEN check_violation THEN NULL;
      END;
      -- a band goal with lo >= hi must be rejected
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, band_lo, band_hi, start_date, label, unit)
          VALUES ('__assert_2', 'zz_assert_band', 'band', 'withings.weight', 2, 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION 'assertion: inverted band was accepted';
      EXCEPTION WHEN check_violation THEN NULL;
      END;
      -- positive controls: one valid row per kind is ACCEPTED, so the rejections above fail for the
    -- reason they test and not for an unrelated column (rolled back via P0099)
    BEGIN
      INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, target_date, band_lo, band_hi, start_date, label, unit) VALUES
        ('zz_c1','zz_c_dated','dated','withings.fat_ratio','down',1,DATE '2000-02-01',NULL,NULL,DATE '2000-01-01','x','x'),
        ('zz_c2','zz_c_undated','undated','withings.muscle_mass','up',1,NULL,NULL,NULL,DATE '2000-01-01','x','x'),
        ('zz_c3','zz_c_band','band','withings.weight',NULL,NULL,NULL,1,2,DATE '2000-01-01','x','x'),
        ('zz_c4','zz_c_count','count','garmin.strength_training','up',1,NULL,NULL,NULL,DATE '2000-01-01','x','x'),
        ('zz_c5','zz_c_mean','mean','garmin.sleep_hours','up',1,NULL,NULL,NULL,DATE '2000-01-01','x','x'),
        ('zz_c6','zz_c_intake','intake','nutrition.protein_g','up',1,NULL,NULL,NULL,DATE '2000-01-01','x','x');
      RAISE SQLSTATE 'P0099';
    EXCEPTION WHEN SQLSTATE 'P0099' THEN NULL;
    END;
    -- an unknown source must be rejected
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('__assert_3', 'zz_assert_src', 'undated', 'garmin.nope', 'up', 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION 'assertion: unknown source_key was accepted';
      EXCEPTION WHEN check_violation THEN NULL;
      END;
      -- legacy rows still satisfy the table (expand-only)
      IF EXISTS (SELECT 1 FROM ops.goal WHERE goal_id IS NULL AND metric = 'weight_kg' AND target IS NULL) THEN
        RAISE EXCEPTION 'assertion: legacy weight_kg row lost its target';
      END IF;
      -- least privilege
      IF has_table_privilege('qs_goals', 'ops.goal', 'SELECT') OR has_table_privilege('qs_goals', 'ops.goal', 'UPDATE')
         OR has_table_privilege('qs_goals', 'ops.goal_progress', 'DELETE')
         OR has_table_privilege('qs_goals', 'ops.goal_progress', 'UPDATE')
         OR has_table_privilege('qs_goals', 'withings.measurement', 'SELECT') THEN
        RAISE EXCEPTION 'assertion: qs_goals has more than INSERT on the result tables';
      END IF;
      IF NOT has_table_privilege('qs_goals', 'ops.goal_progress', 'INSERT') THEN
        RAISE EXCEPTION 'assertion: qs_goals cannot insert progress';
      END IF;
      IF has_table_privilege('qs_reader', 'ops.goal_progress', 'INSERT') THEN
        RAISE EXCEPTION 'assertion: qs_reader can write results';
      END IF;
      -- with no runs the health view must fail closed once a goal is active (checked on a synthetic goal)
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('__assert_4', 'zz_assert_live', 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x');
        IF (SELECT ok FROM ops.goal_health_v) IS DISTINCT FROM false
           AND NOT EXISTS (SELECT 1 FROM ops.goal_latest_run_v) THEN
          RAISE EXCEPTION 'assertion: health view reported ok with an active goal and no run';
        END IF;
        RAISE SQLSTATE 'P0099';  -- undo the synthetic row
      EXCEPTION WHEN SQLSTATE 'P0099' THEN NULL;
      END;
    END
    $$;

    COMMIT;
  0007_expenditure.sql: |
    -- 0007: MacroFactor's expenditure estimate (TDEE), one value per day (22/11/2026).
    --
    -- Only exports with "Expenditure" ticked carry the sheet, so the importer upserts it
    -- when present and leaves stored rows alone when absent. Keyed like nutrition.daily.
    -- The weekly report compares it with expenditure measured from logged intake and the
    -- Withings weight trend. Schema only: no values here (the repo is public).
    -- Idempotent: safe to re-run.

    CREATE TABLE IF NOT EXISTS nutrition.expenditure (
        date             date    NOT NULL,
        source           text    NOT NULL,
        expenditure_kcal numeric NOT NULL CHECK (expenditure_kcal > 0 AND expenditure_kcal < 10000),
        fetched_at       text    NOT NULL,
        PRIMARY KEY (date, source)
    );

    GRANT SELECT, INSERT, UPDATE, DELETE ON nutrition.expenditure TO qs_writer;
    -- Carter reads by membership of qs_reader (cluster.yaml), so this covers it too.
    GRANT SELECT ON nutrition.expenditure TO qs_reader;
  0008_goals_contract.sql: |
    -- 0008: goals contract (22/11/2026). Removes the two legacy ops.goal rows that 0006 left in place and makes
    -- goal_id the identity.
    --
    -- 0006 was expand-only: the old rows (metric 'weight_kg', the retired ranch weight goal, and 'height_m') kept
    -- goal_id NULL while the Overview/Withings/BMI panels still read them. Since 689fd5f no dashboard does: the
    -- weight panels read the weight_hold band and BMI reads ops.setting, so the rows are dead and misleading.
    --
    -- goal_id becomes the PRIMARY KEY (it was a unique index beside a metric PK); metric stays NOT NULL and UNIQUE
    -- so existing upserts on (metric) keep working. goal_kind_shape_ck still exempts goal_id IS NULL; that branch
    -- is now unreachable (NOT NULL) and is left alone rather than re-typed.
    -- No goal values here (public repo). Idempotent: a re-run finds nothing to delete and re-asserts the shape.

    BEGIN;

    -- Refuse to delete anything unexpected: the only identity-less rows may be the two legacy ones.
    DO $$
    DECLARE stray text;
    BEGIN
      SELECT string_agg(metric, ', ') INTO stray FROM ops.goal WHERE goal_id IS NULL AND metric NOT IN ('weight_kg', 'height_m');
      IF stray IS NOT NULL THEN RAISE EXCEPTION '0008: unexpected goal rows without goal_id: %', stray; END IF;
      -- Height must already live in ops.setting (0006 copied it) before its legacy row goes.
      IF EXISTS (SELECT 1 FROM ops.goal WHERE metric = 'height_m')
         AND NOT EXISTS (SELECT 1 FROM ops.setting WHERE key = 'height_m') THEN
        RAISE EXCEPTION '0008: ops.setting has no height_m; refusing to drop the legacy height row';
      END IF;
    END $$;

    CREATE TEMP TABLE goal_ids_before ON COMMIT DROP AS SELECT goal_id, active FROM ops.goal WHERE goal_id IS NOT NULL;

    DELETE FROM ops.goal WHERE goal_id IS NULL AND metric IN ('weight_kg', 'height_m');

    ALTER TABLE ops.goal ALTER COLUMN goal_id SET NOT NULL;
    ALTER TABLE ops.goal DROP CONSTRAINT IF EXISTS goal_pkey;
    ALTER TABLE ops.goal ADD CONSTRAINT goal_pkey PRIMARY KEY (goal_id);
    DROP INDEX IF EXISTS ops.goal_goal_id_uq;   -- redundant with the primary key
    ALTER TABLE ops.goal DROP CONSTRAINT IF EXISTS goal_metric_uq;
    ALTER TABLE ops.goal ADD CONSTRAINT goal_metric_uq UNIQUE (metric);

    -- ── assertions ───────────────────────────────────────────────────────────────────────────────────
    DO $$
    BEGIN
      IF EXISTS (SELECT 1 FROM ops.goal WHERE metric IN ('weight_kg', 'height_m')) THEN
        RAISE EXCEPTION '0008: legacy rows still present';
      END IF;
      -- Every real goal survived, with its active flag unchanged.
      IF EXISTS (SELECT goal_id, active FROM goal_ids_before EXCEPT SELECT goal_id, active FROM ops.goal)
         OR EXISTS (SELECT goal_id, active FROM ops.goal EXCEPT SELECT goal_id, active FROM goal_ids_before) THEN
        RAISE EXCEPTION '0008: the set of goals changed';
      END IF;
      IF (SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conrelid = 'ops.goal'::regclass AND conname = 'goal_pkey')
         IS DISTINCT FROM 'PRIMARY KEY (goal_id)' THEN
        RAISE EXCEPTION '0008: primary key is not (goal_id)';
      END IF;
      IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'ops.goal'::regclass AND conname = 'goal_metric_uq' AND contype = 'u') THEN
        RAISE EXCEPTION '0008: metric is no longer unique';
      END IF;
      -- The views over ops.goal still plan and run.
      PERFORM count(*) FROM ops.goal_progress_latest_v;
      PERFORM count(*) FROM ops.goal_health_v;
    END $$;

    -- Negative controls: each must be rejected for the reason named (subtransactions, so nothing persists).
    DO $$
    BEGIN
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('zz_0008_a', NULL, 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION '0008 control: a goal without goal_id was accepted';
      EXCEPTION WHEN not_null_violation THEN NULL;
      END;
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('zz_0008_b', 'zz_0008_dup', 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x'),
                 ('zz_0008_c', 'zz_0008_dup', 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION '0008 control: a duplicate goal_id was accepted';
      EXCEPTION WHEN unique_violation THEN NULL;
      END;
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('zz_0008_m', 'zz_0008_d', 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x'),
                 ('zz_0008_m', 'zz_0008_e', 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION '0008 control: a duplicate metric was accepted';
      EXCEPTION WHEN unique_violation THEN NULL;
      END;
      -- Positive control: a well-formed goal is accepted (then rolled back by the enclosing subtransaction).
      BEGIN
        INSERT INTO ops.goal (metric, goal_id, kind, source_key, direction, target, start_date, label, unit)
          VALUES ('zz_0008_ok', 'zz_0008_ok', 'undated', 'withings.weight', 'down', 1, DATE '2000-01-01', 'x', 'x');
        RAISE EXCEPTION USING ERRCODE = 'P0001', MESSAGE = 'zz_0008_rollback';
      EXCEPTION WHEN raise_exception THEN
        IF SQLERRM <> 'zz_0008_rollback' THEN RAISE; END IF;
      END;
      IF EXISTS (SELECT 1 FROM ops.goal WHERE goal_id LIKE 'zz_0008%') THEN RAISE EXCEPTION '0008: control rows leaked'; END IF;
    END $$;

    COMMIT;
