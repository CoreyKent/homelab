# applied by Jobs pg-migrate-0001 (0001_init.sql) and pg-migrate-0002 (0002_nutrition.sql); idempotent wrapping so a Job re-run is safe; future migrations are new keys + new Jobs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-migrations
data:
  0001_init.sql: |
    CREATE SCHEMA IF NOT EXISTS garmin; CREATE SCHEMA IF NOT EXISTS withings; CREATE SCHEMA IF NOT EXISTS ops;

    -- local_date is a PLAIN column set by the collector at ingestion (Australia/Sydney),
    -- not a generated column: generated columns require IMMUTABLE functions and AT TIME ZONE
    -- is only STABLE — declaring it IMMUTABLE anyway is a correctness lie (audit finding, cut).

    CREATE TABLE IF NOT EXISTS garmin.daily_summary (
      calendar_date     date PRIMARY KEY,          -- Garmin device-local day
      steps             integer,
      resting_hr        smallint,                  -- bpm
      stress_avg        smallint,                  -- 0-100
      calories_active   integer,                   -- kcal
      calories_total    integer,                   -- kcal
      body_battery_high smallint, body_battery_low smallint,
      raw               jsonb,
      ingested_at       timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.sleep (
      calendar_date  date PRIMARY KEY,             -- wake-date key: midnight-safe
      sleep_start    timestamptz, sleep_end timestamptz,
      duration_s     integer, deep_s integer, light_s integer, rem_s integer, awake_s integer,
      score          smallint, avg_spo2 real, avg_respiration real,
      raw            jsonb, ingested_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.sleep_stage (
      calendar_date  date NOT NULL REFERENCES garmin.sleep(calendar_date) ON DELETE CASCADE,
      start_ts       timestamptz NOT NULL, end_ts timestamptz NOT NULL,
      stage          text NOT NULL CHECK (stage IN ('deep','light','rem','awake')),
      PRIMARY KEY (calendar_date, start_ts)
    );

    CREATE TABLE IF NOT EXISTS garmin.hrv (
      calendar_date date PRIMARY KEY,
      last_night_avg_ms smallint, weekly_avg_ms smallint,
      status text, baseline_low_ms smallint, baseline_high_ms smallint,
      ingested_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.training_status (
      calendar_date date PRIMARY KEY,
      status text, vo2max real, load_7d real, raw jsonb,
      ingested_at timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS garmin.activity (
      activity_id      bigint PRIMARY KEY,          -- vendor-native natural key
      start_ts         timestamptz NOT NULL,
      local_date       date NOT NULL,               -- collector-computed (Australia/Sydney)
      activity_type    text NOT NULL, name text,
      duration_s       integer, distance_m real, calories integer,
      avg_hr smallint, max_hr smallint, elevation_gain_m real,
      avg_pace_s_km    real, hr_zones jsonb, raw jsonb,
      ingested_at      timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS activity_type_ts ON garmin.activity (activity_type, start_ts DESC);
    CREATE INDEX IF NOT EXISTS activity_local_date ON garmin.activity (local_date);

    CREATE TABLE IF NOT EXISTS garmin.intraday (                  -- generic scalar series
      metric  text NOT NULL CHECK (metric IN
              ('heart_rate','stress','body_battery','spo2','respiration')),
      ts      timestamptz NOT NULL,
      value   real NOT NULL,
      PRIMARY KEY (metric, ts)
    );
    -- (no separate ts index: the composite PK serves every dashboard query pattern; a BRIN on ts
    --  was cut — heap order follows (metric, ts) batches, killing BRIN's block-range correlation)

    CREATE TABLE IF NOT EXISTS garmin.steps_epoch (
      start_ts timestamptz PRIMARY KEY,
      duration_s smallint NOT NULL, steps integer NOT NULL, activity_level text
    );

    CREATE TABLE IF NOT EXISTS withings.measurement (
      group_id     bigint NOT NULL,                 -- Withings grpid
      measure_type integer NOT NULL,                -- 1 weight, 5 FFM, 6 fat%, 8 fat kg, 76 muscle, 77 hydration, 88 bone…
      metric       text NOT NULL,
      ts           timestamptz NOT NULL,
      local_date   date NOT NULL,                   -- collector-computed (Australia/Sydney)
      value        numeric(8,3) NOT NULL,           -- normalized: value * 10^unit at ingestion
      ingested_at  timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (group_id, measure_type)
    );
    CREATE INDEX IF NOT EXISTS measurement_metric_ts ON withings.measurement (metric, ts DESC);
    CREATE INDEX IF NOT EXISTS measurement_metric_localdate ON withings.measurement (metric, local_date);

    CREATE OR REPLACE VIEW withings.daily_weight AS            -- canonical: FIRST weigh-in of local day
    SELECT DISTINCT ON (local_date) local_date, ts, value AS weight_kg
    FROM withings.measurement WHERE metric = 'weight'
    ORDER BY local_date, ts ASC, group_id ASC;      -- group_id = deterministic tie-break on equal ts

    CREATE TABLE IF NOT EXISTS ops.sync_state (
      source text NOT NULL, stream text NOT NULL,
      watermark timestamptz NOT NULL,               -- re-fetch watermark - 72h (late arrivals)
      blocked_until timestamptz,                    -- 429 state machine: runs no-op until passed.
                                                    -- Garmin 429s are ACCOUNT-level: written to the
                                                    -- ('garmin','_account') sentinel row, checked by
                                                    -- ALL garmin streams before any call (audit fix)
      extra jsonb, updated_at timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (source, stream)
    );

    CREATE TABLE IF NOT EXISTS ops.run_log (
      run_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      source text NOT NULL, stream text NOT NULL,
      kind text NOT NULL CHECK (kind IN ('cron','backfill')),
      started_at timestamptz NOT NULL DEFAULT now(), finished_at timestamptz,
      status text CHECK (status IN ('ok','partial','failed')),
      days_attempted integer, days_failed integer, rows_upserted integer,
      first_error text, details jsonb
    );
    CREATE INDEX IF NOT EXISTS run_log_source_started ON ops.run_log (source, started_at DESC);

    -- Withings chain: refresh under advisory lock; COMMIT new pair BEFORE first use
    -- (old refresh token stays valid until the new access token is first used — crash-safe).
    CREATE TABLE IF NOT EXISTS ops.withings_oauth_token (
      singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),
      access_token text NOT NULL, refresh_token text NOT NULL,
      access_expires_at timestamptz NOT NULL,
      refreshed_at timestamptz NOT NULL DEFAULT now(),
      refresh_count integer NOT NULL DEFAULT 0
    );

    CREATE TABLE IF NOT EXISTS ops.garmin_session (
      singleton boolean PRIMARY KEY DEFAULT true CHECK (singleton),
      token_blob jsonb NOT NULL, refreshed_at timestamptz NOT NULL DEFAULT now()
    );

    -- Goal values: seeded BY HAND via psql (never via Git-tracked migrations — public repo).
    CREATE TABLE IF NOT EXISTS ops.goal (
      metric      text PRIMARY KEY,                -- 'weight_kg'
      target      numeric(8,3) NOT NULL,
      target_date date,
      note        text,
      updated_at  timestamptz NOT NULL DEFAULT now()
    );

    -- Roles are created WITHOUT passwords here on purpose: this DDL lives in the PUBLIC repo, and
    -- passwords belong in SOPS-encrypted Secrets. CNPG's declarative `managed.roles` (passwordSecret)
    -- owns role creation + credentials; this migration only shapes GRANTs (audit fix).
    GRANT USAGE ON SCHEMA garmin, withings TO qs_writer;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA garmin, withings TO qs_writer;
    ALTER DEFAULT PRIVILEGES IN SCHEMA garmin, withings
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO qs_writer;
    -- ops: per-table for the writer — it must NOT touch ops.goal (hand-seeded, least-privilege):
    GRANT USAGE ON SCHEMA ops TO qs_writer;
    GRANT SELECT, INSERT, UPDATE, DELETE
      ON ops.sync_state, ops.run_log, ops.withings_oauth_token, ops.garmin_session TO qs_writer;
    GRANT SELECT ON ops.goal TO qs_writer;          -- read-only: goal is Corey's, not the collector's
    -- reader: metric schemas broadly (future metric tables SHOULD be visible — deliberate),
    -- ops strictly per-table; token tables have no reader path at all:
    GRANT USAGE ON SCHEMA garmin, withings TO qs_reader;
    GRANT SELECT ON ALL TABLES IN SCHEMA garmin, withings TO qs_reader;
    ALTER DEFAULT PRIVILEGES IN SCHEMA garmin, withings GRANT SELECT ON TABLES TO qs_reader;
    GRANT USAGE ON SCHEMA ops TO qs_reader;
    GRANT SELECT ON ops.run_log, ops.sync_state, ops.goal TO qs_reader;
    -- no reader grant on token tables, and no ops-wide default privileges for either role:
    -- a future ops table starts reachable by nobody until explicitly granted
  0002_nutrition.sql: |
    -- Nutrition in PostgreSQL keeps the same split as the local intake layer:
    -- daily macros stay wide for the constant reads, while micronutrients stay
    -- long-form because the metric set is sparse and changes over time.
    -- The upstream intake source is a manual export, not a live API feed, so data
    -- freshness cannot safely live in session context or operator memory.
    -- nutrition_v therefore carries the freshness verdict on every row, adjacent to
    -- the intake values being read, so every consumer sees age with the numbers.
    -- Supplements can be logged as foods and otherwise disappear into daily totals,
    -- so detection is modeled explicitly instead of inferred ad hoc.
    -- Detection is signature-based: two per-unit metrics imply integer units,
    -- capped by config, and days before first detection remain pre_tracking rather
    -- than not_taken because earlier history is unknown.
    -- SQLite CAST(... AS INTEGER) truncates toward zero; this port preserves that
    -- with trunc(... )::int anywhere age or unit counts depend on the cast result.
    -- The supplement config tables are created empty on purpose. This repository is
    -- public, so private config values are not embedded in the migration; the
    -- importer seeds them from code after install.
    -- Re-runs must not destroy already-seeded config, so the migration is written
    -- to be idempotent and safe to apply again.
    -- Role creation and any credentials are owned elsewhere; this file only grants
    -- access to existing roles, which are created separately without passwords.

    BEGIN;

    CREATE SCHEMA IF NOT EXISTS nutrition;

    -- Manual exports do not stay fresh on their own, so the canonical read view
    -- carries a freshness verdict on every row instead of relying on session
    -- context.
    CREATE TABLE IF NOT EXISTS nutrition.daily (
        id bigint GENERATED BY DEFAULT AS IDENTITY UNIQUE,
        date date NOT NULL,
        source text NOT NULL,
        calories_kcal double precision,
        protein_g double precision,
        carbs_g double precision,
        fat_g double precision,
        fetched_at text NOT NULL,
        PRIMARY KEY (date, source)
    );

    CREATE INDEX IF NOT EXISTS idx_nutrition_date
        ON nutrition.daily (date);

    CREATE TABLE IF NOT EXISTS nutrition.micros (
        id bigint GENERATED BY DEFAULT AS IDENTITY UNIQUE,
        date date NOT NULL,
        source text NOT NULL,
        metric text NOT NULL,
        value double precision,
        fetched_at text NOT NULL,
        PRIMARY KEY (date, source, metric)
    );

    CREATE INDEX IF NOT EXISTS idx_nutrition_micros_date
        ON nutrition.micros (date);

    CREATE INDEX IF NOT EXISTS idx_nutrition_micros_metric
        ON nutrition.micros (metric);

    -- A supplement logged as a food is otherwise mixed into the daily micro totals.
    -- Detection is signature-based, and the config is seeded later by the importer,
    -- never by this public migration, so re-runs must not delete existing rows.
    CREATE TABLE IF NOT EXISTS nutrition.supplement_products (
        product text PRIMARY KEY,
        display_name text NOT NULL,
        macrofactor_entry text NOT NULL,
        unit_name text NOT NULL,
        max_units integer NOT NULL CHECK (max_units >= 1),
        sig_metric_1 text NOT NULL,
        sig_per_unit_1 double precision NOT NULL CHECK (sig_per_unit_1 > 0),
        sig_metric_2 text NOT NULL,
        sig_per_unit_2 double precision NOT NULL CHECK (sig_per_unit_2 > 0),
        sig_frac double precision NOT NULL,
        track_from date NOT NULL,
        notes text
    );

    CREATE TABLE IF NOT EXISTS nutrition.supplement_contents (
        product text NOT NULL,
        metric text NOT NULL,
        value_per_unit double precision NOT NULL,
        PRIMARY KEY (product, metric)
    );

    CREATE OR REPLACE VIEW nutrition.nutrition_v AS
    SELECT
        n.*,
        MAX(n.date) OVER () AS data_last_entry,
        trunc(
            EXTRACT(
                EPOCH FROM (
                    (now() AT TIME ZONE 'UTC') - (MAX(n.date) OVER ())::timestamp
                )
            ) / 86400.0
        )::int AS data_age_days,
        CASE
            WHEN EXTRACT(
                EPOCH FROM (
                    (now() AT TIME ZONE 'UTC') - (MAX(n.date) OVER ())::timestamp
                )
            ) / 86400.0 > 14
                THEN 'STALE — last entry ' || to_char(MAX(n.date) OVER (), 'YYYY-MM-DD')
                     || ' — ASK COREY TO RE-EXPORT MacroFactor'
            WHEN EXTRACT(
                EPOCH FROM (
                    (now() AT TIME ZONE 'UTC') - (MAX(n.date) OVER ())::timestamp
                )
            ) / 86400.0 > 3
                THEN 'AGING — last entry ' || to_char(MAX(n.date) OVER (), 'YYYY-MM-DD')
                     || ' — state the age before quoting current intake'
            ELSE 'fresh — last entry ' || to_char(MAX(n.date) OVER (), 'YYYY-MM-DD')
        END AS freshness
    FROM nutrition.daily AS n;

    CREATE OR REPLACE VIEW nutrition.supplement_days_v AS
    WITH det AS (
        SELECT
            n.date,
            p.product,
            p.display_name,
            p.max_units,
            p.track_from,
            CASE
                WHEN n.date < p.track_from THEN 0
                -- LEAST() is safe here: every argument is non-NULL via NOT NULL
                -- config, COALESCE() on the observed totals, and write-time checks
                -- that forbid zero divisors.
                ELSE LEAST(
                    p.max_units,
                    trunc(COALESCE(m1.value, 0) / p.sig_per_unit_1 + 1 - p.sig_frac)::int,
                    trunc(COALESCE(m2.value, 0) / p.sig_per_unit_2 + 1 - p.sig_frac)::int
                )
            END AS units
        FROM nutrition.daily AS n
        CROSS JOIN nutrition.supplement_products AS p
        LEFT JOIN nutrition.micros AS m1
            ON m1.date = n.date
           AND m1.source = n.source
           AND m1.metric = p.sig_metric_1
        LEFT JOIN nutrition.micros AS m2
            ON m2.date = n.date
           AND m2.source = n.source
           AND m2.metric = p.sig_metric_2
    ),
    first_hit AS (
        SELECT
            det.product,
            MIN(det.date) AS first_detected
        FROM det
        WHERE det.units >= 1
        GROUP BY det.product
    )
    SELECT
        det.date,
        det.product,
        det.display_name,
        det.units,
        det.max_units,
        CASE WHEN det.units = det.max_units THEN 1 ELSE 0 END AS full_dose,
        first_hit.first_detected,
        CASE
            WHEN det.units >= 1 THEN 'taken'
            WHEN first_hit.first_detected IS NULL
                 OR det.date < first_hit.first_detected THEN 'pre_tracking'
            ELSE 'not_taken'
        END AS status
    FROM det
    LEFT JOIN first_hit
        ON first_hit.product = det.product;

    CREATE OR REPLACE VIEW nutrition.nutrition_food_v AS
    WITH supp AS (
        SELECT
            s.date,
            c.metric,
            SUM(c.value_per_unit * s.units) AS amount
        FROM nutrition.supplement_days_v AS s
        JOIN nutrition.supplement_contents AS c
            ON c.product = s.product
        WHERE s.units >= 1
        GROUP BY s.date, c.metric
    )
    SELECT
        m.date,
        m.metric,
        m.value AS total_logged,
        COALESCE(supp.amount, 0) AS from_supplements,
        CASE
            WHEN m.value IS NULL THEN NULL
            ELSE GREATEST(m.value - COALESCE(supp.amount, 0), 0)
        END AS food_only,
        (
            SELECT string_agg(s.product, ',')
            FROM nutrition.supplement_days_v AS s
            WHERE s.date = m.date
              AND s.status = 'pre_tracking'
        ) AS untracked_products
    FROM nutrition.micros AS m
    LEFT JOIN supp
        ON supp.date = m.date
       AND supp.metric = m.metric;

    -- Role creation and credentials live elsewhere; this migration only shapes
    -- grants for the schema objects created here.
    GRANT USAGE ON SCHEMA nutrition TO qs_writer, qs_reader;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA nutrition TO qs_writer;
    GRANT SELECT ON ALL TABLES IN SCHEMA nutrition TO qs_reader;

    ALTER DEFAULT PRIVILEGES IN SCHEMA nutrition
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO qs_writer;

    ALTER DEFAULT PRIVILEGES IN SCHEMA nutrition
        GRANT SELECT ON TABLES TO qs_reader;

    COMMIT;
  0003_activity_local_date.sql: |
    -- Migration 0003: date Garmin activities where they happened.
    -- Until collector 0.1.2 the collector set garmin.activity.local_date by converting
    -- startTimeGMT to Australia/Sydney, which put every activity recorded abroad a day
    -- late (55 of 372 rows on 03/11/2026, all on US trips). Garmin's startTimeLocal is
    -- already in the activity's own timezone; collector 0.1.2 uses it for new rows, and
    -- this repairs the existing ones from the raw payload each row already stores.
    -- Idempotent: touches only rows whose local_date differs; a rerun changes 0 rows.
    -- A malformed startTimeLocal (not YYYY-MM-DD...) is skipped, not guessed.
    BEGIN;
    DO $$
    DECLARE
      n integer;
    BEGIN
      UPDATE garmin.activity
         SET local_date = substring(raw->>'startTimeLocal' FROM 1 FOR 10)::date
       WHERE raw->>'startTimeLocal' ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
         AND local_date IS DISTINCT FROM substring(raw->>'startTimeLocal' FROM 1 FOR 10)::date;
      GET DIAGNOSTICS n = ROW_COUNT;
      RAISE NOTICE 'garmin.activity local_date repaired: % rows', n;
    END
    $$;
    COMMIT;
