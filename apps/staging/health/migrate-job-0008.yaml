# Migration 0008: goals contract (22/11/2026). Drops the two legacy ops.goal rows (no dashboard reads them since
# 689fd5f) and makes goal_id the primary key. Deletes only those two rows (it refuses if any other row lacks a
# goal_id); no goal values in it.
# Jobs are immutable; 0001-0007 are untouched and stay Completed for audit.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-migrate-0008
spec:
  backoffLimit: 3
  # Hard ceiling so a never-ready dependency cannot leave the wait loops running forever.
  activeDeadlineSeconds: 1800
  # Completed Job kept for audit; ttlSecondsAfterFinished is deliberately unset.
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:18.4
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h health-pg-rw.health.svc -U postgres; do
                sleep 2
              done
      containers:
        - name: migrate
          # Same image as the server guarantees matching client versions.
          image: ghcr.io/cloudnative-pg/postgresql:18.4
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-pg-superuser
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Wait for CNPG's managed-role reconciliation before running GRANTs: the
              # migration references qs_reader/qs_writer/qs_goals, and racing them into a permanently
              # Failed Job would wedge (Job specs are immutable to Flux re-apply).
              until psql "host=health-pg-rw.health.svc user=postgres dbname=health" -tAc \
                "SELECT count(*) FROM pg_roles WHERE rolname IN ('qs_reader','qs_writer','qs_goals')" | grep -qx 3; do
                sleep 2
              done
              psql "host=health-pg-rw.health.svc user=postgres dbname=health" -v ON_ERROR_STOP=1 -f /migrations/0008_goals_contract.sql
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: pg-migrations
