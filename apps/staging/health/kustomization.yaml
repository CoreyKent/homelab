apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: health
resources:
  - ../../base/health/
  # Co-located so the Cluster's managed roles get their SOPS-encrypted credentials in one apply.
  - pg-qs-writer.secret.yaml
  - pg-qs-reader.secret.yaml
  - pg-carter.secret.yaml
  - pg-qs-goals.secret.yaml
  - withings-app.secret.yaml
  - hevy-api.secret.yaml
  # Garmin tokenstore seed — sealed from Corey MFA bootstrap 23/07/2026; DB becomes authoritative after first run.
  - garmin-tokenstore.secret.yaml
  - cluster.yaml
  - migrations.yaml
  - migrate-job.yaml
  - migrate-job-0002.yaml
  - migrate-job-0003.yaml
  - migrate-job-0004.yaml
  - migrate-job-0005.yaml
  - migrate-job-0006.yaml
  - migrate-job-0007.yaml
  - migrate-job-0008.yaml
  - migrate-job-0009.yaml
  - backup-pvc.yaml
  - pg-tailnet-service.yaml
  - pgdump-cronjob.yaml
  - goals-deadman-cronjob.yaml
  - garmin-cronjob.yaml
  - withings-cronjob.yaml
  - hevy-cronjob.yaml
  # Grafana admin secret — sealed by the orchestrator; referenced here, never authored by the builder.
  - grafana-admin.secret.yaml
  - grafana-pvc.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - grafana-certificate.yaml
  - grafana-ingressroute.yaml
  - grafana-ini.yaml
  - grafana-datasource.yaml
  - grafana-dashboards-provider.yaml
# Dashboards are generated so each ConfigMap name carries a hash of its content (22/11/2026). Grafana mounts them
# with subPath, which never refreshes in a running pod, so a dashboard edit used to need a manual restart, and a
# manual `kubectl rollout restart` is reverted by Flux (it drops the restartedAt annotation, restarting Grafana a second
# time). With hashed names, an edit changes the name the Deployment references and Flux rolls Grafana once, by itself.
# Edit the JSON in dashboards/; goals.json is generated by goals-gen/build-goals-dashboard.ts.
configMapGenerator:
  - name: grafana-dashboard-garmin
    files: [garmin.json=dashboards/garmin.json]
  - name: grafana-dashboard-withings
    files: [withings.json=dashboards/withings.json]
  - name: grafana-dashboard-overview
    files: [overview.json=dashboards/overview.json]
  - name: grafana-dashboard-goals
    files: [goals.json=dashboards/goals.json]
# backfill-job.yaml is intentionally excluded: it is a manual kubectl create -f template, and Jobs are immutable.
