# Tailnet-only exposure via the shared tessarack-ingress node (100.91.68.85):
# cloud DNS resolves the name everywhere, but the address routes only for
# tailnet members. L4 passthrough at the operator means traefik serves the
# cert below itself.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  # HOMEPAGE AUTO-DISCOVERY (migrated 26/07/2026 from a hand-listed
  # services.yaml entry; that manual entry is deleted in this SAME commit --
  # keeping both renders the tile twice).
  #
  # The status badge requires the pod template to carry
  # app.kubernetes.io/name equal to THIS object's metadata.name ("grafana").
  # Homepage looks pods up by that label; without it the tile appears but the
  # badge reads NOT FOUND. The label is added to grafana-deployment.yaml in
  # this commit. Failure mode proven by the whoami canary, 26/07/2026.
  #
  # Deliberate loss: the old manual entry carried
  # `siteMonitor: https://health.tessarack.dev` (external HTTP probe).
  # Discovery replaces it with in-cluster pod status -- a better signal here,
  # since it reports the workload rather than the ingress path.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Health metrics & dashboards"
    gethomepage.dev/group: "Homelab"
    gethomepage.dev/icon: "grafana.png"
    # href pinned rather than inferred from the Host() rule -- Homepage's
    # match-rule parsing is unreliable, and a bad href is indistinguishable
    # from discovery having failed outright.
    gethomepage.dev/href: "https://health.tessarack.dev"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`health.tessarack.dev`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  tls:
    secretName: health-tessarack-dev-tls
