apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump-nightly
spec:
  # 16:30 UTC = 02:30 Australia/Sydney during AEST; CronJob schedules run in UTC.
  schedule: "30 16 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          # Added 2026-07-31. Without this the job had NEVER once succeeded:
          # the image runs as uid=26(postgres) gid=102(postgres), but a freshly
          # provisioned iSCSI volume mounts root:root 0755, so pg_dump failed with
          #   could not open output file "/backups/health-<date>.dump": Permission denied
          # and the retention pass then failed a second way on ext4's root-only
          # lost+found:
          #   find: '/backups/lost+found': Permission denied
          # fsGroup makes the kubelet chown the volume (contents included, so
          # lost+found too) to this GID on every mount, which fixes both and, unlike
          # a manual chown, survives the PVC being recreated.
          securityContext:
            fsGroup: 102
          containers:
            - name: pgdump
              # Same image as the server guarantees matching client versions.
              image: ghcr.io/cloudnative-pg/postgresql:18.4
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: health-pg-superuser
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  pg_dump "host=health-pg-rw.health.svc user=postgres dbname=health" -Fc -f "/backups/health-$(date +%F).dump"
                  # 30-day retention; the monthly restore drill lives in the runbook.
                  find /backups -name '*.dump' -mtime +30 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
