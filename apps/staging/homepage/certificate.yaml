apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homepage-tessarack-dev
  namespace: homepage
spec:
  secretName: homepage-tessarack-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - homepage.tessarack.dev
  privateKey:
    algorithm: ECDSA
    size: 256
  duration: 2160h
  renewBefore: 720h
