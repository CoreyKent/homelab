apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  annotations:
    # A pruned backup PVC is an irreversible loss: exempt it from Flux garbage collection.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-iscsi-retain
  resources:
    requests:
      storage: 20Gi
