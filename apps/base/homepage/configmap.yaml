apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
  settings.yaml: |
    title: Tessarack Homelab
    headerStyle: clean
    theme: dark
    color: slate
    # Group names MUST be unique across services.yaml AND bookmarks.yaml.
    # A bookmark group sharing a name with a service group renders nothing
    # (2026-07-26: bookmarks group was named "Homelab", collided, showed zero).
    layout:
      Homelab:
        style: row
        columns: 4
      Platform:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      # "Discovered" group RETIRED 26/07/2026. It existed solely to hold the
      # whoami auto-discovery canary, which has served its purpose: discovery
      # is proven and Grafana now arrives through the same mechanism into
      # "Homelab" above. Auto-discovered apps join whichever existing group
      # their gethomepage.dev/group annotation names — they do not need a
      # group of their own.
      Radio:
        style: column
      Study:
        style: column
      Accounts:
        style: column
  docker.yaml: ""
  services.yaml: |
    - Homelab:
        # Grafana MIGRATED to auto-discovery 26/07/2026 — it is now defined by
        # annotations on apps/staging/health/grafana-ingressroute.yaml and must
        # NOT be listed here, or the tile renders twice.
        #
        # Only Grafana migrated. Mealie, ITPM and Finance Progress could not:
        # their IngressRoutes (mealie-public, itpm-dashboard-tls,
        # finance-progress-private) exist ONLY in cluster state — they are
        # absent from this repo and carry no Flux ownership labels. Annotating
        # them would mean hand-editing live objects that git does not track.
        # Adopt them into the repo first; then they migrate the same way.
        - Mealie:
            href: https://mealie.tessarack.dev
            siteMonitor: https://mealie.tessarack.dev
            description: Recipe manager
            icon: mealie.png
        - ITPM:
            href: https://itpm.tessarack.dev
            siteMonitor: https://itpm.tessarack.dev
            description: ITPM Macro Dashboard
            icon: mdi-view-dashboard
        - Pulse:
            href: https://pulse.tessarack.dev
            # DELIBERATELY has no siteMonitor/ping, unlike every other tile here.
            # Measured 2026-07-26 from inside the homepage pod: pulse.tessarack.dev
            # resolves to 100.127.112.71 -- a DIFFERENT tailnet node from the
            # cluster's own ingress (100.91.68.85). The pod reaches the latter
            # (health.tessarack.dev -> 302, 200) but gets 100% ICMP loss and an
            # HTTPS timeout to the former. Cluster pods have no route onto the
            # wider tailnet, so BOTH probe types would render a permanent error
            # badge. Adding one back requires routing the cluster to that node
            # (tailscale subnet router / operator egress), not a config change.
            description: Life OS dashboard
            icon: mdi-pulse
        - Linkding:
            href: https://linkding-lab.tessarack.com
            siteMonitor: https://linkding-lab.tessarack.com
            description: Bookmarks
            icon: linkding.png
    - Platform:
        - Prometheus:
            description: Metrics & alerting
            icon: prometheus.png
            # No href: Prometheus has no ingress. In-cluster ClusterIP, no auth.
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring:9090
        - Registry:
            href: http://192.168.50.81:30500/v2/
            siteMonitor: http://192.168.50.81:30500/v2/
            description: Container registry (API only, no UI)
            icon: mdi-package-variant-closed
        - Finance Progress:
            href: http://192.168.50.81:8080
            siteMonitor: http://192.168.50.81:8080
            description: Finance progress app
            icon: mdi-finance
        - Gatus:
            href: https://status.tessarack.dev
            description: Uptime monitoring
            icon: gatus.png
            widget:
              type: gatus
              url: http://gatus.gatus:8080
    - Infrastructure:
        - Proxmox lab01:
            href: https://192.168.50.116:8006
            description: tessarack-lab01
            icon: proxmox.png
            widget:
              type: proxmox
              url: https://192.168.50.116:8006
              node: tessarack-lab01
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
        - Proxmox lab02:
            href: https://192.168.50.117:8006
            description: tessarack-lab02
            icon: proxmox.png
            widget:
              type: proxmox
              url: https://192.168.50.117:8006
              node: tessarack-lab02
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
        - Synology NAS:
            href: https://192.168.50.127:5001
            description: DSM / storage
            icon: synology.png
            # UPGRADE PATH — CORRECTION 26/07/2026: this widget is NOT satisfiable
            # with a read-only account. Per gethomepage.dev/widgets/services/diskstation,
            # uptime/CPU/memory come from SYNO.Core.System, which requires the account
            # to be in the DSM **Administrators** group, and the widget is incompatible
            # with 2FA. Least-privilege shape is therefore: dedicated user, in
            # Administrators, "No Access" to every shared folder, all applications
            # denied except DSM. Weigh that exposure against a dashboard tile before
            # enabling. Uncomment once HOMEPAGE_VAR_SYNOLOGY_* exist in the secret.
            # widget:
            #   type: diskstation
            #   url: https://192.168.50.127:5001
            #   username: "{{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}"
            #   password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
        - ASUS Router:
            href: http://192.168.50.1
            description: RT-AX86S
            icon: mdi-router-wireless
        - Tailscale:
            href: https://login.tailscale.com/admin/machines
            description: Tailnet admin
            icon: tailscale.png
            # WIDGET DECLINED 26/07/2026 (Corey's call, my recommendation). The
            # tailscale widget needs an API access token that expires in at most
            # 90 days and cannot be extended or disabled
            # (tailscale.com/kb/1101/api-keys) -- the tile would go red every
            # quarter with no warning. Replaced by a Gatus endpoint,
            # `tailnet-ingress` (tcp://100.91.68.85:443): no credential, no
            # expiry, and it watches the node this whole dashboard depends on.
            # This tile stays a plain link to the admin console.
            # widget:
            #   type: tailscale
            #   deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
            #   key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
        - Cloudflare Tunnels:
            href: https://one.dash.cloudflare.com
            description: cloudflared (linkding + tessarack-ingress)
            icon: cloudflare.png
            # APPROVED 26/07/2026. accountid and tunnelid are both hardcoded
            # below: neither is a secret (a tunnel ID is an identifier; the
            # secret is the credentials.json the connector holds).
            #
            # tunnelid RESOLVED 26/07/2026 from the cluster, not the dashboard:
            #   tessarack-ingress  2ff4d280-2db6-49c0-8ecc-9f5d57adc56f  <-- used
            #   k3s-linkding       6dc72933-3d8f-45e8-8a9f-c704a58e3780
            # Read out of the `tunnel-credentials` Secret's credentials.json in
            # each namespace. This CORRECTS my earlier note: the cfd_tunnel API
            # returning an empty list was scope-filtering, now proven — the same
            # token also returns an EMPTY list from /accounts, i.e. it holds no
            # account-level scope whatsoever (it is zone-scoped Zone.DNS-edit).
            #
            # STILL BLOCKED on one item only:
            #   HOMEPAGE_VAR_CF_API_TOKEN -- new custom token, single permission
            #       Account > Cloudflare Tunnel > Read. I cannot mint this:
            #       GET /user/tokens returns HTTP 403, so the existing token
            #       lacks User > API Tokens > Edit. It must be created in the
            #       dashboard. Do NOT substitute the ~/.env Zone.DNS-edit token
            #       -- this pod has no authentication of its own, so a DNS-write
            #       credential inside it is a materially worse exposure than the
            #       tile is worth.
            # Uncomment the block below once that key exists in homepage-secrets.
            # widget:
            #   type: cloudflared
            #   accountid: "f06bb074f10ab6c01d699da5a257cf4b"
            #   tunnelid: "2ff4d280-2db6-49c0-8ecc-9f5d57adc56f"
            #   key: "{{HOMEPAGE_VAR_CF_API_TOKEN}}"
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: tessarack
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank
    - openmeteo:
        label: Canberra
        latitude: -35.28
        longitude: 149.13
        units: metric
        cache: 5
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
  bookmarks.yaml: |
    - Radio:
        - QRZ:
            - abbr: QRZ
              href: https://www.qrz.com
        - Solar / propagation:
            - abbr: SOL
              href: https://www.hamqsl.com/solar.html
        - SOTA:
            - abbr: SOTA
              href: https://sotawatch.sota.org.uk
        - POTA:
            - abbr: POTA
              href: https://pota.app
        - ACMA register:
            - abbr: ACMA
              href: https://web.acma.gov.au/rrl/register_search.main_page
    - Study:
        - Kubernetes docs:
            - abbr: K8S
              href: https://kubernetes.io/docs/home/
        - CKA curriculum:
            - abbr: CKA
              href: https://github.com/cncf/curriculum
        - killer.sh:
            - abbr: KIL
              href: https://killer.sh
        - RemNote:
            - abbr: REM
              href: https://www.remnote.com
    - Accounts:
        - IBKR:
            - abbr: IB
              href: https://www.interactivebrokers.com.au
        - Garmin Connect:
            - abbr: GC
              href: https://connect.garmin.com
        - Cloudflare:
            - abbr: CF
              href: https://dash.cloudflare.com
        - homelab repo:
            - abbr: GIT
              href: https://github.com/CoreyKent/homelab
  custom.css: ""
  custom.js: ""
