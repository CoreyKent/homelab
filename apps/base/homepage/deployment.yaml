apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          # Pinned deliberately (repo convention — no :latest). Latest stable at authoring.
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Mandatory since v1.0. $(MY_POD_IP) is expanded by Kubernetes at runtime.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.tessarack.dev"
          # Service-widget credentials ({{HOMEPAGE_VAR_*}}) from the SOPS-sealed secret.
          envFrom:
            - secretRef:
                name: homepage-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
            - { name: config, mountPath: /app/config/settings.yaml,   subPath: settings.yaml }
            - { name: config, mountPath: /app/config/services.yaml,   subPath: services.yaml }
            - { name: config, mountPath: /app/config/widgets.yaml,    subPath: widgets.yaml }
            - { name: config, mountPath: /app/config/bookmarks.yaml,  subPath: bookmarks.yaml }
            - { name: config, mountPath: /app/config/docker.yaml,     subPath: docker.yaml }
            - { name: config, mountPath: /app/config/custom.css,      subPath: custom.css }
            - { name: config, mountPath: /app/config/custom.js,       subPath: custom.js }
            - { name: logs,   mountPath: /app/config/logs }
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
