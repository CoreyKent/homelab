apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/data.db
    ui:
      title: Tessarack Status
      header: Tessarack
    # Checks hit in-cluster Services by DNS rather than the public hostnames.
    # Rationale: this isolates "the app is down" from "the ingress/DNS/cert path
    # is down". The two ingress-path checks at the bottom cover the latter.
    endpoints:
      - name: homepage
        group: apps
        url: http://homepage.homepage:3000
        interval: 60s
        conditions: ["[STATUS] == 200"]
      - name: grafana-health
        group: apps
        url: http://grafana.health:3000/api/health
        interval: 60s
        conditions: ["[STATUS] == 200"]
      - name: mealie
        group: apps
        url: http://mealie.mealie:9000
        interval: 60s
        conditions: ["[STATUS] < 400"]
      - name: itpm
        group: apps
        url: http://itpm-dashboard.itpm:8050
        interval: 60s
        conditions: ["[STATUS] < 400"]
      - name: linkding
        group: apps
        url: http://linkding.linkding:9090
        interval: 60s
        conditions: ["[STATUS] < 400"]
      - name: finance-progress
        group: apps
        url: http://finance-progress-app.finance-progress:8080
        interval: 60s
        conditions: ["[STATUS] < 400"]
      - name: prometheus
        alerts:
          - type: ntfy
            enabled: true
            description: "prometheus is down"
        group: platform
        url: http://kube-prometheus-stack-prometheus.monitoring:9090/-/healthy
        interval: 60s
        conditions: ["[STATUS] == 200"]
      - name: registry
        group: platform
        url: http://registry.registry:5000/v2/
        interval: 60s
        conditions: ["[STATUS] < 400"]
      - name: health-postgres
        alerts:
          - type: ntfy
            enabled: true
            description: "health-postgres is down"
        group: platform
        url: tcp://health-pg-rw.health:5432
        interval: 120s
        conditions: ["[CONNECTED] == true"]
      # Hosts outside the cluster. Both serve self-signed/private certs on their
      # management ports, hence insecure: true -- this checks reachability, not
      # certificate validity.
      - name: proxmox-lab01
        alerts:
          - type: ntfy
            enabled: true
            description: "proxmox-lab01 is down"
        group: infrastructure
        url: https://192.168.50.116:8006
        interval: 120s
        client:
          insecure: true
        conditions: ["[STATUS] < 400"]
      - name: proxmox-lab02
        alerts:
          - type: ntfy
            enabled: true
            description: "proxmox-lab02 is down"
        group: infrastructure
        url: https://192.168.50.117:8006
        interval: 120s
        client:
          insecure: true
        conditions: ["[STATUS] < 400"]
      # Substitute for the Homepage Tailscale widget (declined 26/07/2026). That
      # widget needs an API access token which, per tailscale.com/kb/1101/api-keys,
      # expires in at most 90 days and cannot be extended -- so the tile would go
      # silently red every quarter. This checks the thing that actually matters
      # (is the shared tailnet ingress node answering) with no credential and no
      # expiry. 100.91.68.85 is the tessarack-ingress tailnet node that every
      # *.tessarack.dev private route depends on, including this dashboard.
      - name: tailnet-ingress
        alerts:
          - type: ntfy
            enabled: true
            description: "tailnet-ingress is down"
        group: infrastructure
        url: tcp://100.91.68.85:443
        interval: 60s
        conditions: ["[CONNECTED] == true"]
      - name: synology-dsm
        alerts:
          - type: ntfy
            enabled: true
            description: "synology-dsm is down"
        group: infrastructure
        url: https://192.168.50.127:5001
        interval: 120s
        client:
          insecure: true
        conditions: ["[STATUS] < 400"]
      # Ingress-path checks: these traverse Traefik + the real cert, so a failure
      # here with the in-cluster check green means the ingress path broke.
      - name: homepage-via-ingress
        alerts:
          - type: ntfy
            enabled: true
            description: "homepage-via-ingress is down"
        group: ingress
        url: https://homepage.tessarack.dev
        interval: 120s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      - name: grafana-via-ingress
        alerts:
          - type: ntfy
            enabled: true
            description: "grafana-via-ingress is down"
        group: ingress
        url: https://health.tessarack.dev
        interval: 120s
        conditions:
          - "[STATUS] < 400"
          - "[CERTIFICATE_EXPIRATION] > 168h"

      # Alert canary REMOVED 27/07/2026 — it did its job. It existed to prove
      # the one link nothing else exercised: that Gatus itself resolves
      # ${GATUS_NTFY_TOPIC} from its environment and publishes to ntfy.
      # PROVEN 26/07/2026 12:15:25Z — polling the topic's own message history
      # returned "Gatus: infrastructure/alert-canary-delete-me", a push sent by
      # Gatus, distinct from the manual curl sent at 11:02Z. Substitution and
      # the publish path are measured, not inferred. Note for any future
      # re-test: the Gatus logs carry NO send-success and NO send-failure line,
      # so log silence proves nothing either way — poll the ntfy topic instead.

    # ALERTING -- ntfy, enabled 26/07/2026. Field names verified against the
    # Gatus README (alerting.ntfy.{url,topic,priority,token,default-alert}).
    # The topic comes from GATUS_NTFY_TOPIC, supplied by the SOPS-sealed
    # gatus-secrets and substituted by Gatus's ${VAR} expansion at load, so it
    # never appears in this ConfigMap. It is a NEW dedicated topic, not Corey's
    # PAI/ntfy topic -- separate streams stay separately revocable, and no
    # ~/.claude secret crosses into this repo.
    alerting:
      ntfy:
        url: https://ntfy.sh
        topic: ${GATUS_NTFY_TOPIC}
        priority: 3
        default-alert:
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true
