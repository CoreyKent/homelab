apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  # RWO volume + RollingUpdate is a deadlock, not a preference (2026-07-31).
  # RollingUpdate starts the replacement pod BEFORE terminating the old one.
  # If the scheduler places it on a different node it can never attach the
  # ReadWriteOnce volume, and the rollout hangs forever:
  #   Multi-Attach error for volume "pvc-..." Volume is already used by pod(s) ...
  # Observed live: a linkding rollout sat in ContainerCreating for 48 minutes
  # and only cleared when the old pod was deleted by hand. Recreate terminates
  # first, so the volume detaches cleanly. Costs a few seconds of downtime on a
  # single-replica app that has no HA anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
          ports:
            - containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false

          # Added 2026-07-31. Without requests this pod was BestEffort QoS and
          # would be the first thing the kubelet evicts under node memory
          # pressure, regardless of importance.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          # /health verified HTTP 200 from INSIDE the pod (127.0.0.1:9090) —
          # not via the Service, which is not how the kubelet probes and can
          # give a misleading result on apps that check the Host header.
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
