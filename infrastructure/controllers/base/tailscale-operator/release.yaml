apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      # 1.98.9 -> 1.104.7 on 18/11/2026: newest in the Tailscale Helm index (created 2026-11-12) and
      # the first release whose k8s-operator AND tailscale images are both published. Proxies follow
      # the operator's version. Checked against 1.98.9: Deployment selector still `app: operator`
      # (immutable, unchanged under default nameOverride/fullnameOverride); oauth Secret still
      # `operator-oauth`; CRDs moved into templates/tailscale.com_*.yaml with the same names plus
      # new peerrelays.tailscale.com, which `upgrade.crds: CreateReplace` below creates.
      version: "1.104.7"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    # OAuth credentials come from the pre-created, SOPS-encrypted `operator-oauth`
    # secret in the staging overlay (co-located under infra-controllers so it
    # applies WITH the operator — avoids an infra-configs dependsOn deadlock).
    # Leaving clientId empty makes the chart consume that secret rather than
    # manage its own: templates/oauth-secret.yaml is gated on oauth.clientId.
    oauth:
      clientId: ""
