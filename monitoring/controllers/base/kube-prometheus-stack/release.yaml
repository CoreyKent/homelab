apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"

      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      adminPassword: default

    # ---- Persistence (added 2026-07-31) -------------------------------------
    # Both Prometheus and Alertmanager were on emptyDir, so every reschedule
    # silently discarded their data. Proven, not theoretical: retention was set
    # to 10d while the TSDB actually held 18h, because the pod moved during the
    # 30/07 rolling drain. emptyDir also put the TSDB on the NODE's root disk —
    # k3s01 was at 74% and k3s04 at 73%, so moving to the NAS frees node disk
    # as well as making the data durable.
    #
    # fsGroup 2000 is REQUIRED, not decorative: both pods run uid 1000/gid 2000
    # and a freshly provisioned iSCSI volume mounts root:root 0755. Without it
    # they cannot write — the identical fault that left pg-dump-nightly broken
    # for 8 days (fixed in c43a413).
    prometheus:
      prometheusSpec:
        # Measured 31/07: 756MB in 18h ≈ 1.0 GB/day, so 10d ≈ 10GB.
        # 20Gi leaves room for compaction working space and cardinality growth.
        retention: 10d
        retentionSize: 15GB          # self-trim before the PVC can ever fill
        scrapeInterval: 60s          # was 30s — halves sample rate, see below
        securityContext:
          fsGroup: 2000
          runAsUser: 1000
          runAsNonRoot: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: synology-iscsi-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      alertmanagerSpec:
        # Currently holds 0 bytes; 1Gi is the Synology CSI floor regardless
        # ("Invalid input: required bytes is smaller than 1G").
        securityContext:
          fsGroup: 2000
          runAsUser: 1000
          runAsNonRoot: true
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: synology-iscsi-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi

    # ---- Cardinality reduction (corrected 2026-07-31) -----------------------
    # SUPERSEDES the prometheusSpec.metricRelabelConfigs block in 8d84472,
    # which silently did NOTHING: metric relabeling in prometheus-operator is
    # per-ServiceMonitor, there is no global knob on the Prometheus CR. That
    # config never reached a single scrape job - verified by grepping the
    # generated /etc/prometheus/config_out/prometheus.env.yaml, where the only
    # metric_relabel_configs present were the chart's own defaults.
    #
    # Measured 31/07 via sum by (job) (scrape_samples_scraped), total 158,285:
    #   kubelet    82,407  52.1%
    #   apiserver  61,733  39.0%   <- these two are 91% of all ingestion
    #   everything else            <- not worth touching
    #
    # kubelet appears here because the kubelet is itself an API client, so it
    # exposes the same apiserver_*/etcd_* client histograms. Same list, both.
    #
    # Only _bucket series are dropped. _sum and _count are KEPT, so request
    # rates and average latency still work; what is lost is histogram_quantile()
    # percentiles on the control plane. Expected: ~79,800 of 158,285 (~50%).
    kubelet:
      serviceMonitor:
        # NOTE: this is the /metrics endpoint only. cAdvisorMetricRelabelings is
        # a SEPARATE key and the chart already ships 6 rules there - deliberately
        # not touched, setting it here would replace them.
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: '(apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|etcd_request_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|storage_operation_duration_seconds_bucket|kubelet_runtime_operations_duration_seconds_bucket)'
            action: drop

    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # This key REPLACES the chart default rather than appending, so the
          # chart's own le-bucket drop is restated below to avoid clobbering it.
          # (Redundant while the whole family is dropped, but kept so the
          # behaviour survives if this drop list is ever narrowed.)
          - sourceLabels: [__name__]
            regex: '(apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|etcd_request_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|storage_operation_duration_seconds_bucket|kubelet_runtime_operations_duration_seconds_bucket)'
            action: drop
          - sourceLabels: [__name__, le]
            regex: 'apiserver_request_duration_seconds_bucket;(0.15|0.2|0.3|0.35|0.4|0.45|0.6|0.7|0.8|0.9|1.25|1.5|1.75|2|3|3.5|4|4.5|6|7|8|9|15|25|40|50)'
            action: drop
